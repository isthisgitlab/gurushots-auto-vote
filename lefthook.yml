# Pre-commit hooks. Runs on STAGED files only and keeps fast — the full test
# suite stays in CI. Sequential (parallel: false) so oxlint --fix and
# prettier --write never race to write the same file; .oxlintrc.json enables no
# formatting rules, so the two never fight over formatting.
pre-commit:
    parallel: false
    commands:
        no-javascript:
            glob: '*.{js,jsx,mjs,cjs}'
            run: 'echo "JavaScript is not allowed, this codebase is TypeScript. Rename to .ts/.tsx/.mts/.cts:" {staged_files} >&2 && exit 1'
        oxlint:
            glob: '*.{ts,tsx,mts,cts}'
            run: pnpm exec oxlint --fix --no-error-on-unmatched-pattern {staged_files}
            stage_fixed: true
        prettier:
            glob: '*.{ts,tsx,mts,cts,json,jsonc,css,md,yml,yaml,html}'
            run: pnpm exec prettier --write {staged_files}
            stage_fixed: true
