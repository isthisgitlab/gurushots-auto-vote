apply plugin: 'com.android.application'
apply plugin: 'jacoco'

// Robolectric 4.17 SDKs for robolectric.properties and @Config(sdk = [30]).
def robolectricSdks = [
    'org.robolectric:android-all-instrumented:11-robolectric-6757853-i7',
    'org.robolectric:android-all-instrumented:16-robolectric-13921718-i7',
].collect { coordinate ->
    configurations.detachedConfiguration(dependencies.create(coordinate)).tap { transitive = false }
}
def robolectricSdkDir = layout.buildDirectory.dir('robolectric-sdks')
def prepareRobolectricSdks = tasks.register('prepareRobolectricSdks', Sync) {
    from robolectricSdks
    into robolectricSdkDir
}

android {
    namespace = "com.isthisgitlab.gurushotsautovote"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.isthisgitlab.gurushotsautovote"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    androidResources {
        // Files and directories to omit from the packaged web assets.
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    buildTypes {
        debug {
            // Instruments testDebugUnitTest with the JaCoCo agent; the report
            // itself is the jacocoTestReport task below.
            enableUnitTestCoverage = true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    testCoverage {
        jacocoVersion = rootProject.ext.jacocoVersion
    }
    testOptions {
        unitTests {
            // Robolectric needs the merged manifest + resources (FileProvider
            // paths, launcher activity, notification icons).
            includeAndroidResources = true
            all {
                dependsOn prepareRobolectricSdks
                inputs.dir(robolectricSdkDir)
                systemProperty 'robolectric.dependency.dir', robolectricSdkDir.get().asFile.absolutePath
                // Robolectric's FileDescriptor interceptor reaches into JDK
                // internals that JDK 17+ no longer exports by default.
                jvmArgs '--add-exports', 'java.base/jdk.internal.access=ALL-UNNAMED'
                // Robolectric loads classes through its own sandbox class loader
                // (no CodeSource), so JaCoCo must be told to instrument those too.
                jacoco {
                    includeNoLocationClasses = true
                    excludes = ['jdk.internal.*']
                }
            }
        }
    }
}

jacoco {
    toolVersion = rootProject.ext.jacocoVersion
}

// JVM unit-test coverage report (XML for Coveralls, HTML for humans) and the
// 100% gate that fails the build on any uncovered code:
//   ./gradlew testDebugUnitTest jacocoTestReport jacocoTestCoverageVerification
//   -> app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
// Only first-party app code is measured; generated R / BuildConfig / Manifest
// classes are excluded.
def configureJacocoInputs = { task ->
    def unitTests = tasks.named('testDebugUnitTest', Test)
    task.dependsOn unitTests
    task.group = 'verification'

    def generated = [
        '**/R.class', '**/R$*.class',
        '**/BuildConfig.*', '**/Manifest*.*',
    ]
    task.classDirectories.setFrom(files(
        tasks.named('compileDebugKotlin').flatMap { it.destinationDirectory }.map { fileTree(it) { exclude generated } },
        tasks.named('compileDebugJavaWithJavac', JavaCompile).flatMap { it.destinationDirectory }.map { fileTree(it) { exclude generated } },
    ))
    task.sourceDirectories.setFrom(files('src/main/java'))
    task.executionData(unitTests.get())
}

tasks.register('jacocoTestReport', JacocoReport) {
    configureJacocoInputs(it)
    description = 'JaCoCo coverage report for the debug JVM unit tests.'
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.register('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    configureJacocoInputs(it)
    description = 'Fails unless the debug JVM unit tests cover 100% of first-party code.'
    violationRules {
        rule {
            // MISSEDCOUNT == 0 rather than COVEREDRATIO >= 1.0: an exact integer
            // check, and the failure message names how many items are uncovered.
            ['INSTRUCTION', 'BRANCH', 'LINE', 'COMPLEXITY', 'METHOD', 'CLASS'].each { counter ->
                limit {
                    it.counter = counter
                    value = 'MISSEDCOUNT'
                    maximum = 0
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    // Native background voting plugin deps
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.4.21"
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    // NOTE: org.json is intentionally NOT declared as a Maven dependency. The
    // Android platform (android.jar / the device framework) already provides
    // org.json.*, which is all the plugin's main code uses (AutoVoteSettings.kt,
    // AutoVoteService.kt). A Maven `org.json:json` dep would be
    // redundant, pull a duplicate copy of platform classes, and make every
    // release build depend on downloading it from Maven Central (where a
    // transient 502 kills assembleRelease). Do not add it
    // — not even as testImplementation: the JVM unit tests run under
    // Robolectric, whose android-all runtime jar ships the real platform
    // org.json, so tests exercise exactly the implementation the device uses.
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:$robolectricVersion"
    testImplementation "androidx.test:core:$androidxTestCoreVersion"
    testImplementation "io.mockk:mockk:$mockkVersion"
    testImplementation "com.squareup.okhttp3:mockwebserver3:$okhttpVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
