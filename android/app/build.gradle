apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'jacoco'

android {
    namespace = "com.isthisgitlab.gurushotsautovote"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.isthisgitlab.gurushotsautovote"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            // Instruments testDebugUnitTest with the JaCoCo agent; the report
            // itself is the jacocoTestReport task below.
            enableUnitTestCoverage = true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    testCoverage {
        jacocoVersion = rootProject.ext.jacocoVersion
    }
    testOptions {
        unitTests {
            // Robolectric needs the merged manifest + resources (FileProvider
            // paths, launcher activity, notification icons).
            includeAndroidResources = true
            all {
                // Robolectric's FileDescriptor interceptor reaches into JDK
                // internals that JDK 17+ no longer exports by default.
                jvmArgs '--add-exports', 'java.base/jdk.internal.access=ALL-UNNAMED'
                // Robolectric loads classes through its own sandbox class loader
                // (no CodeSource), so JaCoCo must be told to instrument those too.
                jacoco {
                    includeNoLocationClasses = true
                    excludes = ['jdk.internal.*']
                }
            }
        }
    }
}

jacoco {
    toolVersion = rootProject.ext.jacocoVersion
}

// JVM unit-test coverage report (XML for Coveralls, HTML for humans) and the
// 100% gate that fails the build on any uncovered code:
//   ./gradlew testDebugUnitTest jacocoTestReport jacocoTestCoverageVerification
//   -> app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
// Only first-party app code is measured; generated R / BuildConfig / Manifest
// classes are excluded.
def configureJacocoInputs = { task ->
    task.dependsOn 'testDebugUnitTest'
    task.group = 'verification'

    def generated = [
        '**/R.class', '**/R$*.class',
        '**/BuildConfig.*', '**/Manifest*.*',
    ]
    def buildDir = layout.buildDirectory
    task.classDirectories.setFrom(files(
        buildDir.dir('tmp/kotlin-classes/debug').map { fileTree(it) { exclude generated } },
        buildDir.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes').map { fileTree(it) { exclude generated } },
    ))
    task.sourceDirectories.setFrom(files('src/main/java'))
    task.executionData.setFrom(fileTree(buildDir) {
        include 'outputs/unit_test_code_coverage/debugUnitTest/*.exec'
    })
}

tasks.register('jacocoTestReport', JacocoReport) {
    configureJacocoInputs(it)
    description = 'JaCoCo coverage report for the debug JVM unit tests.'
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.register('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    configureJacocoInputs(it)
    description = 'Fails unless the debug JVM unit tests cover 100% of first-party code.'
    violationRules {
        rule {
            // MISSEDCOUNT == 0 rather than COVEREDRATIO >= 1.0: an exact integer
            // check, and the failure message names how many items are uncovered.
            ['INSTRUCTION', 'BRANCH', 'LINE', 'COMPLEXITY', 'METHOD', 'CLASS'].each { counter ->
                limit {
                    it.counter = counter
                    value = 'MISSEDCOUNT'
                    maximum = 0
                }
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:1.17.1"
    implementation project(':capacitor-android')
    // Native background voting plugin deps
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.4.20"
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    // NOTE: org.json is intentionally NOT declared as a Maven dependency. The
    // Android platform (android.jar / the device framework) already provides
    // org.json.*, which is all the plugin's main code uses (AutoVoteSettings.kt,
    // AutoVoteService.kt). A Maven `org.json:json` dep was
    // redundant, pulled a duplicate copy of platform classes, and made every
    // release build depend on downloading it from Maven Central (a transient
    // 502 there killed assembleRelease). Do not re-add it
    // — not even as testImplementation: the JVM unit tests run under
    // Robolectric, whose android-all runtime jar ships the real platform
    // org.json, so tests exercise exactly the implementation the device uses.
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:$robolectricVersion"
    testImplementation "androidx.test:core:$androidxTestCoreVersion"
    testImplementation "io.mockk:mockk:$mockkVersion"
    testImplementation "com.squareup.okhttp3:mockwebserver3:$okhttpVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
