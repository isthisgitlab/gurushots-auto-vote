<!doctype html>
<html data-theme="light" lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <!--
            Content-Security-Policy: the renderer only ever loads local (file://) bundles and
            renders remote challenge images from the photo CDN only (img-src). script-src 'self' (no 'unsafe-inline',
            no 'unsafe-eval') is the load-bearing line — it means a sanitizer bypass or a
            supply-chain-tainted bundle cannot execute injected inline script against the full
            window.api surface. connect-src adds the pinned Nostr relays for remote access:
            the pairing host runs in this renderer, and its WebRTC signalling reaches only
            these hosts (docs/architecture.md §10). style-src keeps 'unsafe-inline'
            for DaisyUI/inline element styles.
        -->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://photos.gurushots.com; font-src 'self' data:; connect-src 'self' wss://nos.lol wss://relay.primal.net wss://relay.snort.social wss://nostr.mom wss://offchain.pub; object-src 'none'; base-uri 'self'; form-action 'none'"
        />
        <title>GuruShots Auto Vote</title>
        <link href="../../dist/styles.css" rel="stylesheet" />
        <script defer src="../../dist/app-bundle.js"></script>
    </head>
    <body
        class="min-h-screen bg-base-200 pt-[env(safe-area-inset-top)] pr-[env(safe-area-inset-right)] pb-[env(safe-area-inset-bottom)] pl-[env(safe-area-inset-left)]"
    >
        <div id="root"></div>
    </body>
</html>
