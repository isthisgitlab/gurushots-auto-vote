name: Build and Release

on:
    # No pull_request: trigger — test.yml already runs the full suite (lint,
    # typecheck, audit, coverage, lexicon, size) on every PR. The `test` job
    # below only exists to gate the push-triggered release chain (see its
    # comment), which never fires on a PR, so a PR trigger here would be pure
    # duplicate spend.
    push:
        branches: [master, develop]

# Least-privilege default: read-only token for test / version-bump / the build
# matrix / build-cli-arm / build-android (they read from GitHub for electron
# downloads and rate limits, and upload artifacts — none of which need write).
# Only create-release escalates (it commits the version bump and publishes the
# release; contents:write + actions:write) and attest (id-token:write +
# attestations:write to sign build provenance); each declares its own block.
permissions:
    contents: read

# Serialise the stateful release pipeline per ref. Without this, two quick
# pushes run two full version-bump → build → create-release chains in parallel,
# both bumping/pushing/tagging from the same base — a corrupted release, not
# just wasted minutes. Never cancel a build/release mid-flight.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

# onnxruntime-node's postinstall otherwise downloads the CUDA execution provider
# from NuGet on every linux/x64 install; the app only runs ORT on cpu/wasm
# (services/visionVerifier.ts), so it is dead weight and a NuGet outage fails the job.
env:
    ONNXRUNTIME_NODE_INSTALL: skip

jobs:
    # NOT a duplicate of test.yml: workflows can't gate on each other
    # (GitHub Actions has no cross-workflow `needs`), so this job is the
    # ONLY thing standing between a red test suite and version-bump →
    # build → create-release. Do not remove it as "redundant".
    test:
        # The suite runs Oxlint with its JS plugins, whose fixed-size allocator pool the slim runner cannot satisfy.
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup build environment
              uses: ./.github/actions/setup-build

            # Coverage runs here (not only in test.yml) so Coveralls records one
            # report per release push on master/develop — the same commits that
            # go on to be tagged and published.
            - name: Run tests with coverage
              run: pnpm test:coverage

            # Upload only; never gate the release on Coveralls availability.
            # GITHUB_TOKEN identifies the repo to Coveralls — no repo token secret.
            # One flag of a parallel build: test-android uploads the other and
            # coverage-finish closes it.
            - name: Upload coverage to Coveralls
              uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  file: coverage/lcov.info
                  format: lcov
                  parallel: true
                  flag-name: js
                  fail-on-error: false

    # JVM unit tests for the native Android code (JUnit + Robolectric +
    # MockWebServer, JaCoCo coverage). A separate job because it needs a JDK +
    # Android SDK the slim runner doesn't carry; version-bump waits on it too,
    # so a red native suite blocks the release exactly like a red JS suite.
    test-android:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            # Rejects a tampered gradle-wrapper.jar before ./gradlew runs it.
            - name: Validate Gradle wrapper
              uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

            # A failed dependency check (android/gradle/verification-metadata.xml) says how to regenerate it.
            - name: Explain Gradle dependency verification failures
              uses: ./.github/actions/gradle-verification-hint

            - name: Setup build environment
              uses: ./.github/actions/setup-build
              with:
                  cache-vision-model: 'true'

            - name: Setup Java (JDK 27 — Capacitor 8's Java 21 source/target sets the floor)
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
              with:
                  distribution: 'temurin'
                  java-version: '27'
                  cache: 'gradle'
                  cache-dependency-path: |
                      android/**/*.gradle*
                      android/gradle/wrapper/gradle-wrapper.properties

            - name: Setup Android SDK
              uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

            # cap sync generates the Capacitor gradle subprojects and bridge
            # config assets the tests load; it refuses to run without the web build.
            - name: Build renderer
              run: pnpm build:prep

            - name: Sync Capacitor
              run: pnpm exec cap sync android

            - name: Run Android unit tests with coverage
              working-directory: android
              run: ./gradlew testDebugUnitTest jacocoTestReport

            - name: Upload Android coverage to Coveralls
              uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  file: android/app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
                  format: jacoco
                  # JaCoCo reports package-relative paths (com/isthisgitlab/…);
                  # anchor them to the source root so Coveralls finds the files.
                  base-path: android/app/src/main/java
                  parallel: true
                  flag-name: android
                  fail-on-error: false

            # After the upload so a red gate still publishes the report that
            # shows which lines are missing.
            - name: Enforce 100% Android coverage
              working-directory: android
              run: ./gradlew jacocoTestCoverageVerification

    # Closes the parallel Coveralls build once both reports are in. Nothing
    # depends on it, so a Coveralls outage can never hold up a release.
    coverage-finish:
        runs-on: ubuntu-slim
        timeout-minutes: 5
        needs: [test, test-android]
        if: always()
        steps:
            - name: Finish Coveralls parallel build
              uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  parallel-finished: true
                  carryforward: 'js,android'
                  fail-on-error: false

    version-bump:
        runs-on: ubuntu-slim
        timeout-minutes: 15
        needs: [test, test-android]
        if: github.event_name == 'push'
        outputs:
            new-version: ${{ steps.bump_version.outputs.NEW_VERSION }}
            bump-type: ${{ steps.version_bump_type.outputs.BUMP_TYPE }}
            is-beta: ${{ steps.is_beta.outputs.IS_BETA }}
            is-prerelease: ${{ steps.is_beta.outputs.IS_BETA }}

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup build environment
              uses: ./.github/actions/setup-build
              with:
                  install: 'false'

            - name: Determine if beta
              id: is_beta
              run: |
                  if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
                    echo "IS_BETA=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "IS_BETA=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Determine version bump type
              id: version_bump_type
              # Pass the commit message through the environment instead of
              # ${{ ... }} interpolation so backticks, $(), and parens in the
              # message can't be evaluated as shell. Only the subject line
              # selects the bump: a [major]/[minor] token quoted in the body (a
              # squashed or merged commit lists its parents' messages) must not
              # promote the release.
              env:
                  COMMIT_MSG: ${{ github.event.head_commit.message }}
              run: |
                  SUBJECT=$(printf '%s' "$COMMIT_MSG" | head -n 1)
                  if [[ "$SUBJECT" =~ \[major\] ]]; then
                    echo "BUMP_TYPE=major" >> "$GITHUB_OUTPUT"
                  elif [[ "$SUBJECT" =~ \[minor\] ]]; then
                    echo "BUMP_TYPE=minor" >> "$GITHUB_OUTPUT"
                  else
                    echo "BUMP_TYPE=patch" >> "$GITHUB_OUTPUT"
                  fi

            - name: Bump version
              id: bump_version
              run: |
                  BUMP_TYPE="${{ steps.version_bump_type.outputs.BUMP_TYPE }}"
                  IS_BETA="${{ steps.is_beta.outputs.IS_BETA }}"

                  # `--no-git-checks` skips pnpm's working-tree-dirty check; the bump only
                  # rewrites package.json and we never tag/commit from this step (`--no-git-tag-version`).
                  if [[ "$IS_BETA" == "true" ]]; then
                    # For beta releases, use the appropriate prerelease command
                    if [[ "$BUMP_TYPE" == "major" ]]; then
                      pnpm version premajor --preid=beta --no-git-tag-version --no-git-checks
                    elif [[ "$BUMP_TYPE" == "minor" ]]; then
                      pnpm version preminor --preid=beta --no-git-tag-version --no-git-checks
                    else
                      # For patch, just increment the beta number
                      pnpm version prerelease --preid=beta --no-git-tag-version --no-git-checks
                    fi
                  else
                    pnpm version "$BUMP_TYPE" --no-git-tag-version --no-git-checks
                  fi

                  NEW_VERSION=$(node -p "require('./package.json').version")
                  echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_OUTPUT"

            - name: Upload bumped package.json
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: bumped-package
                  path: package.json
                  retention-days: 1

    build:
        name: build (${{ matrix.os }}, ${{ matrix.variant }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        needs: [version-bump]
        if: github.event_name == 'push'
        strategy:
            matrix:
                include:
                    - os: macos-26
                      platform: mac
                      variant: full
                    - os: ubuntu-latest
                      platform: linux
                      variant: full
                    - os: windows-latest
                      platform: win
                      variant: full
                    - os: windows-latest
                      platform: win
                      variant: lite

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup build environment
              uses: ./.github/actions/setup-build
              with:
                  download-bumped: 'true'
                  cache-vision-model: ${{ matrix.variant != 'lite' }}

            - name: Run linter
              if: matrix.variant != 'lite'
              run: pnpm lint

            - name: Build Electron app
              if: matrix.variant != 'lite'
              run: pnpm build:${{ matrix.platform }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_ENV: production

            # Same app without the local vision model and its runtime, for users
            # who don't want it (scripts/electron-builder-lite.ts → build/lite/).
            - name: Build lite Electron app
              if: matrix.platform != 'win' || matrix.variant == 'lite'
              run: pnpm build:${{ matrix.platform }}:lite
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_ENV: production

            - name: Zip macOS .app files with version
              if: matrix.platform == 'mac'
              run: |
                  set -euo pipefail
                  VERSION=$(node -p "require('./package.json').version")
                  for OUT in build build/lite; do
                    SUFFIX=$([ "$OUT" = build/lite ] && echo -lite || true)
                    APP="$OUT/mac-arm64/GuruShotsAutoVote.app"
                    ZIP="$OUT/GuruShotsAutoVote-v${VERSION}-arm64${SUFFIX}.app.zip"
                    if [ -d "$APP" ]; then
                      # ditto, not zip: the bundle's frameworks are reached through symlinks
                      # (Versions/Current and friends) and zip without -y dereferences them.
                      ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"

                      # Guard against dereferencing: it duplicates Electron Framework and
                      # roughly triples the archive. Count the source bundle rather than hardcode
                      # a total, so this catches a partial dereference too and survives an
                      # Electron bump that changes the framework layout.
                      EXPECTED=$(find "$APP" -type l | wc -l | tr -d ' ')
                      CHECK=$(mktemp -d)
                      ditto -x -k "$ZIP" "$CHECK"
                      ACTUAL=$(find "$CHECK/$(basename "$APP")" -type l | wc -l | tr -d ' ')
                      rm -rf "$CHECK"
                      if [ "$ACTUAL" -ne "$EXPECTED" ]; then
                        echo "::error::.app.zip kept $ACTUAL of $EXPECTED symlinks — the archiver dropped some"
                        exit 1
                      fi
                    fi
                  done

            - name: Build Linux ARM app
              if: matrix.platform == 'linux'
              run: pnpm build:linux-arm
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_ENV: production

            - name: Build lite Linux ARM app
              if: matrix.platform == 'linux'
              run: pnpm build:linux-arm:lite
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_ENV: production

            # Second setup-node ensures the exact Node the notices vendor the LICENSE of
            # (NODE_LICENSE_VERSION in scripts/build-notices.ts) is on PATH for the SEA injection
            # step: build-cli.ts embeds process.versions.node and refuses any other version.
            # No `cache:` here — the composite already restored the pnpm cache earlier in this job.
            - name: Setup Node.js 26 for CLI builds
              if: matrix.platform != 'win'
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: '26.10.0'

            # Cache the official nodejs.org tarball that build-cli.ts pulls into
            # .cache/node-binaries (see the build-cli-arm job for the rationale).
            - name: Resolve Node version for CLI-binary cache key
              if: matrix.platform != 'win'
              id: node-ver
              run: echo "v=$(node -p 'process.versions.node')" >> "$GITHUB_OUTPUT"

            - name: Cache official Node binaries (CLI SEA)
              if: matrix.platform != 'win'
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .cache/node-binaries/node-v*.tar.*
                  key: node-sea-${{ runner.os }}-${{ runner.arch }}-${{ steps.node-ver.outputs.v }}

            - name: Build CLI app (macOS/Linux only)
              if: matrix.platform != 'win'
              run: pnpm build:cli:${{ matrix.platform }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build lite CLI app (macOS/Linux only)
              if: matrix.platform != 'win'
              run: pnpm build:cli:${{ matrix.platform }}:lite
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Check CLI artifact size (macOS/Linux only)
              if: matrix.platform != 'win'
              run: pnpm size:cli

            - name: Upload build artifacts
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: ${{ needs.version-bump.outputs.is-beta == 'true' && 'develop-' || '' }}${{ matrix.platform }}${{ matrix.variant == 'lite' && '-lite' || '' }}-builds
                  path: |
                      build/*.dmg
                      build/GuruShotsAutoVote-v*.app.zip
                      build/*.exe
                      build/*.AppImage
                      build/latest*.yml
                      build/lite/*.dmg
                      build/lite/GuruShotsAutoVote-v*.app.zip
                      build/lite/*.exe
                      build/lite/*.AppImage
                      build/lite/lite*.yml
                      ${{ matrix.platform != 'win' && 'build/cli/' || '' }}
                  retention-days: 1

    build-cli-arm:
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 45
        needs: [version-bump]
        if: github.event_name == 'push'

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup build environment
              uses: ./.github/actions/setup-build
              with:
                  download-bumped: 'true'
                  cache-vision-model: 'true'

            # No `cache:` — the composite already restored the pnpm cache for this job.
            - name: Setup Node.js 26 for CLI build
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: '26.10.0'

            # build-cli.ts downloads the official nodejs.org tarball for
            # TARGET_NODE_VERSION (= process.versions.node) into
            # .cache/node-binaries. Cache it so each release doesn't re-pull the
            # ~40 MB tarball from nodejs.org. Keyed on the resolved Node version
            # + arch so a version bump or a wrong-arch tarball can never be served;
            # build-cli.ts re-checks it against nodejs.org's SHASUMS256.txt and
            # extracts it fresh on every build.
            - name: Resolve Node version for CLI-binary cache key
              id: node-ver
              run: echo "v=$(node -p 'process.versions.node')" >> "$GITHUB_OUTPUT"

            - name: Cache official Node binaries (CLI SEA)
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .cache/node-binaries/node-v*.tar.*
                  key: node-sea-${{ runner.os }}-${{ runner.arch }}-${{ steps.node-ver.outputs.v }}

            - name: Build CLI Linux ARM app (native arm64 runner)
              run: pnpm build:cli:linux-arm
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build lite CLI Linux ARM app (native arm64 runner)
              run: pnpm build:cli:linux-arm:lite
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Check CLI artifact size
              run: pnpm size:cli

            - name: Upload Linux ARM CLI artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: ${{ needs.version-bump.outputs.is-beta == 'true' && 'develop-linux-arm-builds' || 'linux-arm-builds' }}
                  path: build/cli/gurucli-v*-linux-arm*
                  retention-days: 1

    build-android:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: [version-bump]
        if: github.event_name == 'push'
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            # Rejects a tampered gradle-wrapper.jar before ./gradlew runs it.
            - name: Validate Gradle wrapper
              uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

            # A failed dependency check (android/gradle/verification-metadata.xml) says how to regenerate it.
            - name: Explain Gradle dependency verification failures
              uses: ./.github/actions/gradle-verification-hint

            - name: Setup build environment
              uses: ./.github/actions/setup-build
              with:
                  download-bumped: 'true'
                  cache-vision-model: 'true'

            - name: Setup Java (JDK 27 — Capacitor 8's Java 21 source/target sets the floor)
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
              with:
                  distribution: 'temurin'
                  java-version: '27'

            - name: Setup Android SDK
              uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

            - name: Set Android version
              shell: bash
              env:
                  RUN_NUMBER: ${{ github.run_number }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
                  sed -i "s/versionCode [0-9]*/versionCode $RUN_NUMBER/" android/app/build.gradle

            # Two APKs from one webDir, one after the other: the full build and
            # the lite one without the local vision model (build:prep:lite).
            # Built UNSIGNED and with no secret in the environment: this job runs
            # repo and dependency code (pnpm, Gradle plugins), so the release key
            # is only ever decoded in sign-android below.
            - name: Build unsigned APKs with version
              env:
                  NODE_ENV: production
              shell: bash
              run: |
                  set -euo pipefail
                  VERSION=$(node -p "require('./package.json').version")
                  mkdir -p build
                  for VARIANT in full lite; do
                    if [ "$VARIANT" = lite ]; then pnpm build:prep:lite; SUFFIX=-lite; else pnpm build:prep; SUFFIX=; fi
                    pnpm exec cap sync android
                    (cd android && ./gradlew assembleRelease)
                    mv android/app/build/outputs/apk/release/app-release-unsigned.apk \
                       "build/GuruShotsAutoVote-v${VERSION}${SUFFIX}.apk"
                  done

            - name: Upload unsigned Android artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: ${{ needs.version-bump.outputs.is-beta == 'true' && 'develop-android-unsigned' || 'android-unsigned' }}
                  path: build/GuruShotsAutoVote-v*.apk
                  retention-days: 1

    # The only job that sees the release keystore. It runs after build-android
    # (so the signed APK is what attest covers and create-release publishes)
    # and executes no repo or dependency code: it downloads the unsigned APKs,
    # aligns and signs them with the Android build-tools, and refuses to
    # continue unless the signing certificate is the pinned one.
    sign-android:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: [build-android, version-bump]
        if: github.event_name == 'push'
        env:
            # SHA-256 of the release signing certificate (CN=GuruShots Auto Vote,
            # O=isthisgitlab, C=LV) — the "SHA-256 digest" line of
            # `apksigner verify --print-certs` on a released APK, hex with or
            # without colons. While empty the signing step fails.
            ANDROID_CERT_SHA256: '1ce3884456c147e53571bf49c7dc6f11e3fffeddcf6ca4cb9330df9983c265c6'
            BUILD_TOOLS_VERSION: '36.0.0'
        steps:
            - name: Setup Java (apksigner runs on the JVM)
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
              with:
                  distribution: 'temurin'
                  java-version: '27'

            - name: Setup Android SDK
              uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

            - name: Install Android build-tools (zipalign, apksigner)
              shell: bash
              run: sdkmanager "build-tools;${BUILD_TOOLS_VERSION}"

            - name: Download unsigned APKs
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: ${{ needs.version-bump.outputs.is-beta == 'true' && 'develop-android-unsigned' || 'android-unsigned' }}
                  path: unsigned

            - name: Decode keystore
              env:
                  KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
              shell: bash
              run: |
                  set -euo pipefail
                  if [ -z "$KEYSTORE_B64" ]; then
                    echo "::error::ANDROID_KEYSTORE_BASE64 secret not set. Generate a release keystore locally and add the four ANDROID_* secrets — see README's Android section."
                    exit 1
                  fi
                  umask 077
                  echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

            - name: Align, sign and verify APKs
              env:
                  KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              shell: bash
              run: |
                  set -euo pipefail
                  if [ -z "$ANDROID_CERT_SHA256" ]; then
                    echo "::error::ANDROID_CERT_SHA256 is not set in this workflow — pin the release signing certificate's SHA-256 digest before releasing."
                    exit 1
                  fi
                  EXPECTED=$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
                  BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
                  mkdir -p signed
                  for APK in unsigned/GuruShotsAutoVote-v*.apk; do
                    NAME=$(basename "$APK")
                    "$BT/zipalign" -P 16 -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
                    "$BT/apksigner" sign \
                      --ks "$RUNNER_TEMP/release.jks" \
                      --ks-key-alias "$KEY_ALIAS" \
                      --ks-pass env:KEYSTORE_PASSWORD \
                      --key-pass env:KEY_PASSWORD \
                      --out "signed/$NAME" "$RUNNER_TEMP/aligned.apk"
                    rm -f "$RUNNER_TEMP/aligned.apk"
                    CERTS=$("$BT/apksigner" verify --print-certs "signed/$NAME")
                    ACTUAL=$(printf '%s\n' "$CERTS" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr 'A-F' 'a-f')
                    if [ "$ACTUAL" != "$EXPECTED" ]; then
                      echo "::error::$NAME is signed by certificate '$ACTUAL', not the pinned $EXPECTED"
                      exit 1
                    fi
                  done

            # always(): the key must not outlive the job even when signing fails.
            - name: Delete keystore
              if: always()
              shell: bash
              run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/aligned.apk"

            - name: Upload signed Android artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: ${{ needs.version-bump.outputs.is-beta == 'true' && 'develop-android-builds' || 'android-builds' }}
                  path: signed/GuruShotsAutoVote-v*.apk
                  retention-days: 1

    attest:
        needs: [build, build-cli-arm, sign-android, version-bump]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: github.event_name == 'push'
        # id-token: write lets the attestation step request a Sigstore OIDC token
        # to sign with; attestations: write lets it store the signed attestation
        # against this repository. Only this job holds them, so signing stays
        # isolated from the steps that run repo and dependency code (checkout,
        # setup-build, pnpm) in create-release. It only downloads the artifacts.
        permissions:
            contents: read
            id-token: write
            attestations: write

        steps:
            - name: Download all build artifacts
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  path: artifacts

            - name: Attest build provenance
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  # Keep these binary globs in sync with create-release's files: list
                  # (which also carries the updater *.yml manifests, deliberately not attested).
                  subject-path: |
                      artifacts/${{ needs.version-bump.outputs.is-beta == 'true' && 'develop-' || '' }}mac-builds/GuruShotsAutoVote-v*.dmg
                      artifacts/${{ needs.version-bump.outputs.is-beta == 'true' && 'develop-' || '' }}mac-builds/GuruShotsAutoVote-v*.app.zip
                      artifacts/${{ needs.version-bump.outputs.is-beta == 'true' && 'develop-' || '' }}linux-builds/GuruShotsAutoVote-v*.AppImage
                      artifacts/${{ needs.version-bump.outputs.is-beta == 'true' && 'develop-' || '' }}win-builds/GuruShotsAutoVote-v*.exe
                      artifacts/${{ needs.version-bump.outputs.is-beta == 'true' && 'develop-' || '' }}mac-builds/lite/GuruShotsAutoVote-v*.dmg
                      artifacts/${{ needs.version-bump.outputs.is-beta == 'true' && 'develop-' || '' }}mac-builds/lite/GuruShotsAutoVote-v*.app.zip
                      artifacts/${{ needs.version-bump.outputs.is-beta == 'true' && 'develop-' || '' }}linux-builds/lite/GuruShotsAutoVote-v*.AppImage
                      artifacts/${{ needs.version-bump.outputs.is-beta == 'true' && 'develop-' || '' }}win-lite-builds/lite/GuruShotsAutoVote-v*.exe
                      artifacts/${{ needs.version-bump.outputs.is-beta == 'true' && 'develop-' || '' }}mac-builds/cli/gurucli-v*-mac
                      artifacts/${{ needs.version-bump.outputs.is-beta == 'true' && 'develop-' || '' }}mac-builds/cli/gurucli-v*-mac-lite
                      artifacts/${{ needs.version-bump.outputs.is-beta == 'true' && 'develop-' || '' }}linux-builds/cli/gurucli-v*-linux
                      artifacts/${{ needs.version-bump.outputs.is-beta == 'true' && 'develop-' || '' }}linux-builds/cli/gurucli-v*-linux-lite
                      artifacts/${{ needs.version-bump.outputs.is-beta == 'true' && 'develop-' || '' }}linux-arm-builds/gurucli-v*-linux-arm
                      artifacts/${{ needs.version-bump.outputs.is-beta == 'true' && 'develop-' || '' }}linux-arm-builds/gurucli-v*-linux-arm-lite
                      artifacts/${{ needs.version-bump.outputs.is-beta == 'true' && 'develop-' || '' }}android-builds/GuruShotsAutoVote-v*.apk

    create-release:
        needs: [build, build-cli-arm, sign-android, version-bump, attest]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        if: github.event_name == 'push'
        # A job-level permissions block REPLACES the workflow-level set (it does
        # not merge). This job commits the version bump, pushes the tag, and
        # publishes the release, so it escalates above the workflow-level
        # contents:read default. packages:write is omitted — nothing here pushes
        # to GitHub Packages.
        permissions:
            contents: write
            # actions: write is the minimum scope GitHub grants for
            # workflow_dispatch via GITHUB_TOKEN — needed by the "Trigger Pages
            # rebuild" step below (gh workflow run dispatches pages.yml).
            actions: write

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # The commit the binaries were built from, not the branch tip:
                  # a push that landed since must not leak into this release.
                  ref: ${{ github.sha }}

            - name: Setup build environment
              uses: ./.github/actions/setup-build
              with:
                  download-bumped: 'true'
                  install: 'false'

            - name: Get version from package.json
              id: get_version
              run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Update README with current version
              run: pnpm update:readme

            - name: Verify README version
              run: pnpm verify:readme

            # Commit and push the bump BEFORE anything is published, so the tag
            # the release creates points at a commit that exists on the branch.
            # The push is a plain fast-forward: if the branch moved past the
            # built commit meanwhile it is rejected and the job stops here,
            # leaving nothing published. A re-run of this job after the bump
            # was pushed finds it at the branch tip (a commit on top of the
            # built one, carrying the new version) and reuses it instead of
            # committing the same bump a second time, which would be rejected.
            # The reuse only applies while the bump commit is still the branch tip.
            - name: Commit and push version bump
              id: bump_commit
              env:
                  REF_NAME: ${{ github.ref_name }}
                  BUILT_SHA: ${{ github.sha }}
                  NEW_VERSION: ${{ needs.version-bump.outputs.new-version }}
                  BUMP_TYPE: ${{ needs.version-bump.outputs.bump-type }}
              run: |
                  set -euo pipefail
                  git fetch --depth=2 origin "refs/heads/$REF_NAME"
                  TIP_SHA=$(git rev-parse FETCH_HEAD)
                  TIP_PARENT=$(git rev-parse --verify --quiet "$TIP_SHA^" || true)
                  if [[ "$TIP_PARENT" == "$BUILT_SHA" ]]; then
                    TIP_VERSION=$(git show "$TIP_SHA:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
                    if [[ "$TIP_VERSION" == "$NEW_VERSION" ]]; then
                      echo "The version bump to $NEW_VERSION is already on $REF_NAME ($TIP_SHA); reusing it."
                      echo "sha=$TIP_SHA" >> "$GITHUB_OUTPUT"
                      exit 0
                    fi
                  fi
                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"
                  git add package.json README.md README.lv.md docs/usage.md docs/usage.lv.md
                  git commit -m "Bump version to $NEW_VERSION ($BUMP_TYPE) and update documentation [skip ci]"
                  if ! git push origin "HEAD:refs/heads/$REF_NAME"; then
                    echo "::error::Could not push the version bump to $REF_NAME (non-fast-forward: the branch moved past the built commit, or the push was refused). Nothing was published. A re-run succeeds only while the bump commit is still the branch tip; once the branch has moved on, push a new commit to release a new version."
                    exit 1
                  fi
                  echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Generate release name
              id: release_name
              run: |
                  VERSION="${{ steps.get_version.outputs.VERSION }}"
                  echo "RELEASE_NAME=v$VERSION" >> "$GITHUB_OUTPUT"

            - name: Download all build artifacts
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  path: artifacts

            - name: Set release variables
              id: release_vars
              run: |
                  IS_BETA="${{ needs.version-bump.outputs.is-beta }}"

                  # Set title prefix
                  if [[ "$IS_BETA" == "true" ]]; then
                    {
                      echo "TITLE_PREFIX=Pre-Release"
                      echo "BODY_PREFIX=🧪 Pre-Release"
                      echo "ARTIFACT_PREFIX=develop-"
                      echo "WARNING_TEXT=### ⚠️ Important! This is a **pre-release** from the develop branch. Use at your own risk."
                      echo "BUILD_DATE=Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
                    } >> "$GITHUB_OUTPUT"
                  else
                    {
                      echo "TITLE_PREFIX=Release"
                      echo "BODY_PREFIX=📦 Release"
                      echo "ARTIFACT_PREFIX="
                      echo "WARNING_TEXT="
                      echo "BUILD_DATE="
                    } >> "$GITHUB_OUTPUT"
                  fi

            - name: Create Release
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              with:
                  tag_name: ${{ steps.release_name.outputs.RELEASE_NAME }}
                  target_commitish: ${{ steps.bump_commit.outputs.sha }}
                  name: ${{ steps.release_vars.outputs.TITLE_PREFIX }} ${{ steps.release_name.outputs.RELEASE_NAME }}
                  generate_release_notes: true
                  body: |
                      ## ${{ steps.release_vars.outputs.BODY_PREFIX }}

                      ${{ steps.release_vars.outputs.WARNING_TEXT }}

                      ### 🖥️ GUI Applications
                      - **Windows**: Portable executable (x64)
                      - **macOS**: DMG installer + App bundle (ARM64)
                      - **Linux**: AppImage (x64 + ARM64)

                      ### 💻 CLI Applications
                      - **macOS**: Native CLI executable (x64)
                      - **Linux**: Native CLI executables (x64 + ARM64)

                      ### 📱 Mobile Application
                      - **Android**: APK (sideload — no Play Store). Enable "Install unknown apps" for your file manager / browser, then download and tap to install.

                      ### 🪶 Lite Builds
                      Every download above also comes as a `-lite` file without the local AI photo check, for a much smaller download. Auto-fill then keeps its tag-based photo order. Updates stay on the lite builds.

                      ### 🔗 Build Info
                      - Commit: ${{ github.sha }}
                      - Version: ${{ steps.get_version.outputs.VERSION }}
                      - Version Bump Type: ${{ needs.version-bump.outputs.bump-type }}
                      - Verify a binary or APK (GitHub CLI, signed in): `gh attestation verify <file> --repo isthisgitlab/gurushots-auto-vote --signer-workflow isthisgitlab/gurushots-auto-vote/.github/workflows/build.yml`
                      ${{ steps.release_vars.outputs.BUILD_DATE }}
                  draft: false
                  prerelease: ${{ needs.version-bump.outputs.is-beta == 'true' }}
                  # Keep the binary globs in sync with the attest job's subject-path list; the
                  # updater *.yml manifests below are deliberately not attested.
                  files: |
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}mac-builds/GuruShotsAutoVote-v*.dmg
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}mac-builds/GuruShotsAutoVote-v*.app.zip
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}mac-builds/latest-mac.yml
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}linux-builds/GuruShotsAutoVote-v*.AppImage
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}linux-builds/latest-linux*.yml
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}win-builds/GuruShotsAutoVote-v*.exe
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}win-builds/latest.yml
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}mac-builds/lite/GuruShotsAutoVote-v*.dmg
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}mac-builds/lite/GuruShotsAutoVote-v*.app.zip
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}mac-builds/lite/lite-mac.yml
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}linux-builds/lite/GuruShotsAutoVote-v*.AppImage
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}linux-builds/lite/lite-linux*.yml
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}win-lite-builds/lite/GuruShotsAutoVote-v*.exe
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}win-lite-builds/lite/lite.yml
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}mac-builds/cli/gurucli-v*-mac
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}mac-builds/cli/gurucli-v*-mac-lite
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}linux-builds/cli/gurucli-v*-linux
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}linux-builds/cli/gurucli-v*-linux-lite
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}linux-arm-builds/gurucli-v*-linux-arm
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}linux-arm-builds/gurucli-v*-linux-arm-lite
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}android-builds/GuruShotsAutoVote-v*.apk
                      src/assets/THIRD_PARTY_NOTICES.txt
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Pages has no push trigger of its own — it deploys ONLY from this
            # dispatch, so the site never goes live before a release succeeds.
            # (The bump commit above carries [skip ci] so build.yml doesn't
            # re-fire on its own push; workflow_dispatch is not a push, so
            # dispatching pages.yml here doesn't re-trigger build.yml either —
            # no loop.) Guarded to master; Pages serves master, not the develop
            # pre-release channel. A dispatch hiccup must not fail the job — the
            # release is already published — so warn instead of erroring.
            - name: Trigger Pages rebuild (master only)
              if: github.ref_name == 'master'
              # The release and bump are already published by the time we get here,
              # so a dispatch hiccup must not fail the whole job — surface a warning
              # instead so a maintainer can re-run pages.yml from the Actions tab.
              run: |
                  gh workflow run pages.yml --ref master \
                    || echo "::warning::Pages dispatch failed — re-run pages.yml manually from the Actions tab to refresh the site."
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
