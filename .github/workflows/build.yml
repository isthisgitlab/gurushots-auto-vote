name: Build and Release

on:
    # No pull_request: trigger — test.yml already runs the full suite (lint,
    # typecheck, audit, coverage, lexicon, size) on every PR. The `test` job
    # below only exists to gate the push-triggered release chain (see its
    # comment), which never fires on a PR, so a PR trigger here would be pure
    # duplicate spend.
    push:
        branches: [master, develop]

# Least-privilege default: read-only token for test / version-bump / the build
# matrix / build-cli-arm / build-android (they read from GitHub for electron
# downloads and rate limits, and upload artifacts — none of which need write).
# Only create-release escalates (it commits the version bump and publishes the
# release); it declares its own contents:write + actions:write block below.
permissions:
    contents: read

# Serialise the stateful release pipeline per ref. Without this, two quick
# pushes run two full version-bump → build → create-release chains in parallel,
# both bumping/pushing/tagging from the same base — a corrupted release, not
# just wasted minutes. Never cancel a build/release mid-flight.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    # NOT a duplicate of test.yml: workflows can't gate on each other
    # (GitHub Actions has no cross-workflow `needs`), so this job is the
    # ONLY thing standing between a red test suite and version-bump →
    # build → create-release. Do not remove it as "redundant".
    test:
        runs-on: ubuntu-slim
        timeout-minutes: 20
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup build environment
              uses: ./.github/actions/setup-build

            # Coverage runs here (not only in test.yml) so Coveralls records one
            # report per release push on master/develop — the same commits that
            # go on to be tagged and published.
            - name: Run tests with coverage
              run: pnpm test:coverage

            # Upload only; never gate the release on Coveralls availability.
            # GITHUB_TOKEN identifies the repo to Coveralls — no repo token secret.
            # One flag of a parallel build: test-android uploads the other and
            # coverage-finish closes it.
            - name: Upload coverage to Coveralls
              uses: coverallsapp/github-action@v2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  file: coverage/lcov.info
                  format: lcov
                  parallel: true
                  flag-name: js
                  fail-on-error: false

    # JVM unit tests for the native Android code (JUnit + Robolectric +
    # MockWebServer, JaCoCo coverage). A separate job because it needs a JDK +
    # Android SDK the slim runner doesn't carry; version-bump waits on it too,
    # so a red native suite blocks the release exactly like a red JS suite.
    test-android:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup build environment
              uses: ./.github/actions/setup-build

            - name: Setup Java (JDK 21 — required by Capacitor 8 plugins' kotlin jvmToolchain)
              uses: actions/setup-java@v6
              with:
                  distribution: 'temurin'
                  java-version: '21'
                  cache: 'gradle'
                  cache-dependency-path: |
                      android/**/*.gradle*
                      android/gradle/wrapper/gradle-wrapper.properties

            - name: Setup Android SDK
              uses: android-actions/setup-android@v4

            # cap sync generates the Capacitor gradle subprojects and bridge
            # config assets the tests load; it refuses to run without the web build.
            - name: Build renderer
              run: pnpm build:prep

            - name: Sync Capacitor
              run: pnpm exec cap sync android

            - name: Run Android unit tests with coverage
              working-directory: android
              run: ./gradlew testDebugUnitTest jacocoTestReport

            - name: Upload Android coverage to Coveralls
              uses: coverallsapp/github-action@v2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  file: android/app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
                  format: jacoco
                  # JaCoCo reports package-relative paths (com/isthisgitlab/…);
                  # anchor them to the source root so Coveralls finds the files.
                  base-path: android/app/src/main/java
                  parallel: true
                  flag-name: android
                  fail-on-error: false

            # After the upload so a red gate still publishes the report that
            # shows which lines are missing.
            - name: Enforce 100% Android coverage
              working-directory: android
              run: ./gradlew jacocoTestCoverageVerification

    # Closes the parallel Coveralls build once both reports are in. Nothing
    # depends on it, so a Coveralls outage can never hold up a release.
    coverage-finish:
        runs-on: ubuntu-slim
        timeout-minutes: 5
        needs: [test, test-android]
        if: always()
        steps:
            - name: Finish Coveralls parallel build
              uses: coverallsapp/github-action@v2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  parallel-finished: true
                  carryforward: 'js,android'
                  fail-on-error: false

    version-bump:
        runs-on: ubuntu-slim
        timeout-minutes: 15
        needs: [test, test-android]
        if: github.event_name == 'push'
        outputs:
            new-version: ${{ steps.bump_version.outputs.NEW_VERSION }}
            bump-type: ${{ steps.version_bump_type.outputs.BUMP_TYPE }}
            is-beta: ${{ steps.is_beta.outputs.IS_BETA }}
            is-prerelease: ${{ steps.is_beta.outputs.IS_BETA }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup build environment
              uses: ./.github/actions/setup-build
              with:
                  install: 'false'

            - name: Determine if beta
              id: is_beta
              run: |
                  if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
                    echo "IS_BETA=true" >> $GITHUB_OUTPUT
                  else
                    echo "IS_BETA=false" >> $GITHUB_OUTPUT
                  fi

            - name: Determine version bump type
              id: version_bump_type
              # Pass the commit message through the environment instead of
              # ${{ ... }} interpolation so backticks, $(), and parens in the
              # message can't be evaluated as shell.
              env:
                  COMMIT_MSG: ${{ github.event.head_commit.message }}
              run: |
                  if [[ "$COMMIT_MSG" =~ \[major\] ]]; then
                    echo "BUMP_TYPE=major" >> $GITHUB_OUTPUT
                  elif [[ "$COMMIT_MSG" =~ \[minor\] ]]; then
                    echo "BUMP_TYPE=minor" >> $GITHUB_OUTPUT
                  elif [[ "$COMMIT_MSG" =~ \[patch\] ]]; then
                    echo "BUMP_TYPE=patch" >> $GITHUB_OUTPUT
                  else
                    echo "BUMP_TYPE=patch" >> $GITHUB_OUTPUT
                  fi

            - name: Bump version
              id: bump_version
              run: |
                  BUMP_TYPE="${{ steps.version_bump_type.outputs.BUMP_TYPE }}"
                  IS_BETA="${{ steps.is_beta.outputs.IS_BETA }}"

                  # `--no-git-checks` skips pnpm's working-tree-dirty check; the bump only
                  # rewrites package.json and we never tag/commit from this step (`--no-git-tag-version`).
                  if [[ "$IS_BETA" == "true" ]]; then
                    # For beta releases, use the appropriate prerelease command
                    if [[ "$BUMP_TYPE" == "major" ]]; then
                      pnpm version premajor --preid=beta --no-git-tag-version --no-git-checks
                    elif [[ "$BUMP_TYPE" == "minor" ]]; then
                      pnpm version preminor --preid=beta --no-git-tag-version --no-git-checks
                    else
                      # For patch, just increment the beta number
                      pnpm version prerelease --preid=beta --no-git-tag-version --no-git-checks
                    fi
                  else
                    pnpm version $BUMP_TYPE --no-git-tag-version --no-git-checks
                  fi

                  NEW_VERSION=$(node -p "require('./package.json').version")
                  echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

            - name: Upload bumped package.json
              uses: actions/upload-artifact@v7
              with:
                  name: bumped-package
                  path: package.json
                  retention-days: 1

    build:
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        needs: [version-bump]
        if: github.event_name == 'push'
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-26]
                include:
                    - os: macos-26
                      platform: mac
                    - os: ubuntu-latest
                      platform: linux
                    - os: windows-latest
                      platform: win

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup build environment
              uses: ./.github/actions/setup-build
              with:
                  download-bumped: 'true'

            - name: Run linter
              run: pnpm lint

            - name: Build CSS
              run: pnpm build:css

            - name: Build Electron app
              run: pnpm build:${{ matrix.platform }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_ENV: production

            # Same app without the local vision model and its runtime, for users
            # who don't want it (scripts/electron-builder-lite.js → build/lite/).
            - name: Build lite Electron app
              run: pnpm build:${{ matrix.platform }}:lite
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_ENV: production

            - name: Zip macOS .app files with version
              if: matrix.platform == 'mac'
              run: |
                  set -euo pipefail
                  VERSION=$(node -p "require('./package.json').version")
                  for OUT in build build/lite; do
                    SUFFIX=$([ "$OUT" = build/lite ] && echo -lite || true)
                    APP="$OUT/mac-arm64/GuruShotsAutoVote.app"
                    ZIP="$OUT/GuruShotsAutoVote-v${VERSION}-arm64${SUFFIX}.app.zip"
                    if [ -d "$APP" ]; then
                      # ditto, not zip: the bundle's frameworks are reached through symlinks
                      # (Versions/Current and friends) and zip without -y dereferences them.
                      ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"

                      # Guard against dereferencing: it duplicates Electron Framework and
                      # roughly triples the archive. Count the source bundle rather than hardcode
                      # a total, so this catches a partial dereference too and survives an
                      # Electron bump that changes the framework layout.
                      EXPECTED=$(find "$APP" -type l | wc -l | tr -d ' ')
                      CHECK=$(mktemp -d)
                      ditto -x -k "$ZIP" "$CHECK"
                      ACTUAL=$(find "$CHECK/$(basename "$APP")" -type l | wc -l | tr -d ' ')
                      rm -rf "$CHECK"
                      if [ "$ACTUAL" -ne "$EXPECTED" ]; then
                        echo "::error::.app.zip kept $ACTUAL of $EXPECTED symlinks — archiver regression"
                        exit 1
                      fi
                    fi
                  done

            - name: Build Linux ARM app
              if: matrix.platform == 'linux'
              run: pnpm build:linux-arm
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_ENV: production

            - name: Build lite Linux ARM app
              if: matrix.platform == 'linux'
              run: pnpm build:linux-arm:lite
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_ENV: production

            # Second setup-node ensures Node 26 is on PATH for the SEA injection step.
            # No `cache:` here — the composite already restored the pnpm cache earlier in this job.
            - name: Setup Node.js 26 for CLI builds
              if: matrix.platform != 'win'
              uses: actions/setup-node@v7
              with:
                  node-version: '26'

            # Cache the official nodejs.org binary that build-cli.js pulls into
            # .cache/node-binaries (see the build-cli-arm job for the rationale).
            - name: Resolve Node version for CLI-binary cache key
              if: matrix.platform != 'win'
              id: node-ver
              run: echo "v=$(node -p 'process.versions.node')" >> "$GITHUB_OUTPUT"

            - name: Cache official Node binaries (CLI SEA)
              if: matrix.platform != 'win'
              uses: actions/cache@v6
              with:
                  path: .cache/node-binaries
                  key: node-sea-${{ runner.os }}-${{ runner.arch }}-${{ steps.node-ver.outputs.v }}

            - name: Build CLI app (macOS/Linux only)
              if: matrix.platform != 'win'
              run: pnpm build:cli:${{ matrix.platform }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build lite CLI app (macOS/Linux only)
              if: matrix.platform != 'win'
              run: pnpm build:cli:${{ matrix.platform }}:lite
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Check CLI artifact size (macOS/Linux only)
              if: matrix.platform != 'win'
              run: pnpm size:cli

            - name: Upload build artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ needs.version-bump.outputs.is-beta == 'true' && format('develop-{0}-builds', matrix.platform) || format('{0}-builds', matrix.platform) }}
                  path: |
                      build/*.dmg
                      build/GuruShotsAutoVote-v*.app.zip
                      build/*.exe
                      build/*.AppImage
                      build/latest*.yml
                      build/lite/*.dmg
                      build/lite/GuruShotsAutoVote-v*.app.zip
                      build/lite/*.exe
                      build/lite/*.AppImage
                      build/lite/lite*.yml
                      ${{ matrix.platform != 'win' && 'build/cli/' || '' }}
                  retention-days: 1

    build-cli-arm:
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 45
        needs: [version-bump]
        if: github.event_name == 'push'

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup build environment
              uses: ./.github/actions/setup-build
              with:
                  download-bumped: 'true'

            # No `cache:` — the composite already restored the pnpm cache for this job.
            - name: Setup Node.js 26 for CLI build
              uses: actions/setup-node@v7
              with:
                  node-version: '26'

            # build-cli.js downloads the official nodejs.org binary for
            # TARGET_NODE_VERSION (= process.versions.node) into
            # .cache/node-binaries. Cache it so each release doesn't re-pull the
            # ~40 MB tarball from nodejs.org. Keyed on the resolved Node version
            # + arch so a version bump or a wrong-arch binary can never be served.
            - name: Resolve Node version for CLI-binary cache key
              id: node-ver
              run: echo "v=$(node -p 'process.versions.node')" >> "$GITHUB_OUTPUT"

            - name: Cache official Node binaries (CLI SEA)
              uses: actions/cache@v6
              with:
                  path: .cache/node-binaries
                  key: node-sea-${{ runner.os }}-${{ runner.arch }}-${{ steps.node-ver.outputs.v }}

            - name: Build CLI Linux ARM app (native arm64 runner)
              run: pnpm build:cli:linux-arm
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build lite CLI Linux ARM app (native arm64 runner)
              run: pnpm build:cli:linux-arm:lite
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Check CLI artifact size
              run: pnpm size:cli

            - name: Upload Linux ARM CLI artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ needs.version-bump.outputs.is-beta == 'true' && 'develop-linux-arm-builds' || 'linux-arm-builds' }}
                  path: build/cli/gurucli-v*-linux-arm*
                  retention-days: 1

    build-android:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: [version-bump]
        if: github.event_name == 'push'
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup build environment
              uses: ./.github/actions/setup-build
              with:
                  download-bumped: 'true'

            - name: Setup Java (JDK 21 — required by Capacitor 8 plugins' kotlin jvmToolchain)
              uses: actions/setup-java@v6
              with:
                  distribution: 'temurin'
                  java-version: '21'

            - name: Setup Android SDK
              uses: android-actions/setup-android@v4

            - name: Decode keystore
              env:
                  KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
              shell: bash
              run: |
                  if [ -z "$KEYSTORE_B64" ]; then
                    echo "::error::ANDROID_KEYSTORE_BASE64 secret not set. Generate a release keystore locally and add the four ANDROID_* secrets — see README's Android section."
                    exit 1
                  fi
                  echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks

            - name: Set Android version
              shell: bash
              env:
                  RUN_NUMBER: ${{ github.run_number }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
                  sed -i "s/versionCode [0-9]*/versionCode $RUN_NUMBER/" android/app/build.gradle

            # Two APKs from one webDir, one after the other: the full build and
            # the lite one without the local vision model (build:prep:lite).
            - name: Build signed APKs with version
              env:
                  NODE_ENV: production
                  KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              shell: bash
              run: |
                  set -euo pipefail
                  VERSION=$(node -p "require('./package.json').version")
                  mkdir -p build
                  for VARIANT in full lite; do
                    if [ "$VARIANT" = lite ]; then pnpm build:prep:lite; SUFFIX=-lite; else pnpm build:prep; SUFFIX=; fi
                    pnpm exec cap sync android
                    (cd android && ./gradlew assembleRelease \
                      -Pandroid.injected.signing.store.file=$(pwd)/app/release.jks \
                      -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
                      -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
                      -Pandroid.injected.signing.key.password=$KEY_PASSWORD)
                    mv android/app/build/outputs/apk/release/app-release.apk \
                       build/GuruShotsAutoVote-v${VERSION}${SUFFIX}.apk
                  done

            - name: Upload Android artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ needs.version-bump.outputs.is-beta == 'true' && 'develop-android-builds' || 'android-builds' }}
                  path: build/GuruShotsAutoVote-v*.apk
                  retention-days: 1

    create-release:
        needs: [build, build-cli-arm, build-android, version-bump]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        if: github.event_name == 'push'
        # A job-level permissions block REPLACES the workflow-level set (it does
        # not merge). This job commits the version bump, pushes the tag, and
        # publishes the release, so it escalates above the workflow-level
        # contents:read default. packages:write is omitted — nothing here pushes
        # to GitHub Packages.
        permissions:
            contents: write
            # actions: write is the minimum scope GitHub grants for
            # workflow_dispatch via GITHUB_TOKEN — needed by the "Trigger Pages
            # rebuild" step below (gh workflow run dispatches pages.yml).
            actions: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.ref_name }}

            - name: Setup build environment
              uses: ./.github/actions/setup-build
              with:
                  download-bumped: 'true'
                  install: 'false'

            - name: Get version from package.json
              id: get_version
              run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

            - name: Update README with current version
              run: pnpm update:readme

            - name: Verify README version
              run: pnpm verify:readme

            - name: Generate release name
              id: release_name
              run: |
                  VERSION="${{ steps.get_version.outputs.VERSION }}"
                  echo "RELEASE_NAME=v$VERSION" >> $GITHUB_OUTPUT

            - name: Download all build artifacts
              uses: actions/download-artifact@v8
              with:
                  path: artifacts

            - name: Set release variables
              id: release_vars
              run: |
                  IS_BETA="${{ needs.version-bump.outputs.is-beta }}"

                  # Set title prefix
                  if [[ "$IS_BETA" == "true" ]]; then
                    echo "TITLE_PREFIX=Pre-Release" >> $GITHUB_OUTPUT
                    echo "BODY_PREFIX=🧪 Pre-Release" >> $GITHUB_OUTPUT
                    echo "ARTIFACT_PREFIX=develop-" >> $GITHUB_OUTPUT
                    echo "WARNING_TEXT=### ⚠️ Important! This is a **pre-release** from the develop branch. Use at your own risk." >> $GITHUB_OUTPUT
                    echo "BUILD_DATE=Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_OUTPUT
                  else
                    echo "TITLE_PREFIX=Release" >> $GITHUB_OUTPUT
                    echo "BODY_PREFIX=📦 Release" >> $GITHUB_OUTPUT
                    echo "ARTIFACT_PREFIX=" >> $GITHUB_OUTPUT
                    echo "WARNING_TEXT=" >> $GITHUB_OUTPUT
                    echo "BUILD_DATE=" >> $GITHUB_OUTPUT
                  fi

            - name: Create Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ steps.release_name.outputs.RELEASE_NAME }}
                  target_commitish: ${{ github.ref_name }}
                  name: ${{ steps.release_vars.outputs.TITLE_PREFIX }} ${{ steps.release_name.outputs.RELEASE_NAME }}
                  generate_release_notes: true
                  body: |
                      ## ${{ steps.release_vars.outputs.BODY_PREFIX }}

                      ${{ steps.release_vars.outputs.WARNING_TEXT }}

                      ### 🖥️ GUI Applications
                      - **Windows**: Portable executable (x64)
                      - **macOS**: DMG installer + App bundle (ARM64)
                      - **Linux**: AppImage (x64 + ARM64)

                      ### 💻 CLI Applications
                      - **macOS**: Native CLI executable (x64)
                      - **Linux**: Native CLI executables (x64 + ARM64)

                      ### 📱 Mobile Application
                      - **Android**: APK (sideload — no Play Store). Enable "Install unknown apps" for your file manager / browser, then download and tap to install.

                      ### 🪶 Lite Builds
                      Every download above also comes as a `-lite` file without the local AI photo check, for a much smaller download. Auto-fill then keeps its tag-based photo order. Updates stay on the lite builds.

                      ### 🔗 Build Info
                      - Commit: ${{ github.sha }}
                      - Version: ${{ steps.get_version.outputs.VERSION }}
                      - Version Bump Type: ${{ needs.version-bump.outputs.bump-type }}
                      ${{ steps.release_vars.outputs.BUILD_DATE }}
                  draft: false
                  prerelease: ${{ needs.version-bump.outputs.is-beta == 'true' }}
                  files: |
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}mac-builds/GuruShotsAutoVote-v*.dmg
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}mac-builds/GuruShotsAutoVote-v*.app.zip
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}mac-builds/latest-mac.yml
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}linux-builds/GuruShotsAutoVote-v*.AppImage
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}linux-builds/latest-linux*.yml
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}win-builds/GuruShotsAutoVote-v*.exe
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}win-builds/latest.yml
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}mac-builds/lite/GuruShotsAutoVote-v*.dmg
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}mac-builds/lite/GuruShotsAutoVote-v*.app.zip
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}mac-builds/lite/lite-mac.yml
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}linux-builds/lite/GuruShotsAutoVote-v*.AppImage
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}linux-builds/lite/lite-linux*.yml
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}win-builds/lite/GuruShotsAutoVote-v*.exe
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}win-builds/lite/lite.yml
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}mac-builds/cli/gurucli-v*-mac
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}mac-builds/cli/gurucli-v*-mac-lite
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}linux-builds/cli/gurucli-v*-linux
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}linux-builds/cli/gurucli-v*-linux-lite
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}linux-arm-builds/gurucli-v*-linux-arm
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}linux-arm-builds/gurucli-v*-linux-arm-lite
                      artifacts/${{ steps.release_vars.outputs.ARTIFACT_PREFIX }}android-builds/GuruShotsAutoVote-v*.apk
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Commit and push version bump
              run: |
                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"
                  git add package.json README.md README.lv.md
                  git commit -m "Bump version to ${{ needs.version-bump.outputs.new-version }} (${{ needs.version-bump.outputs.bump-type }}) and update documentation [skip ci]"
                  git push origin ${{ github.ref_name }}

            # Pages has no push trigger of its own — it deploys ONLY from this
            # dispatch, so the site never goes live before a release succeeds.
            # (The bump commit above carries [skip ci] so build.yml doesn't
            # re-fire on its own push; workflow_dispatch is not a push, so
            # dispatching pages.yml here doesn't re-trigger build.yml either —
            # no loop.) Guarded to master; Pages serves master, not the develop
            # pre-release channel. A dispatch hiccup must not fail the job — the
            # release is already published — so warn instead of erroring.
            - name: Trigger Pages rebuild (master only)
              if: github.ref_name == 'master'
              # The release and bump are already published by the time we get here,
              # so a dispatch hiccup must not fail the whole job — surface a warning
              # instead so a maintainer can re-run pages.yml from the Actions tab.
              run: |
                  gh workflow run pages.yml --ref master \
                    || echo "::warning::Pages dispatch failed — re-run pages.yml manually from the Actions tab to refresh the site."
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
