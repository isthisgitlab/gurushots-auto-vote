name: Test

on:
    push:
        branches: [master, develop, feature/*]
    pull_request:
        branches: [master, develop]

# Least-privilege default token. `pnpm install` runs the postinstall scripts
# opted into allowBuilds (esbuild, @swc/core, …), so a compromised transitive
# dep here must not inherit a write-capable GITHUB_TOKEN.
permissions:
    contents: read

# Cancel superseded runs on the same ref for PRs (fast feedback), but let
# branch pushes finish so a green run is recorded per commit.
concurrency:
    group: test-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    test:
        runs-on: ubuntu-slim

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup build environment
              uses: ./.github/actions/setup-build
              with:
                  cache-vision-model: 'true'

            - name: Audit dependencies
              # --prod scopes the gate to shipped runtime deps (the ones that
              # handle auth tokens) so an unfixable advisory in a dev-only or
              # alpha-pinned tool can't block unrelated PRs. An unresolvable prod
              # advisory can be excepted via pnpm's `auditConfig` in package.json.
              run: pnpm audit --prod --audit-level=high

            - name: Run linter
              run: pnpm lint

            # Informational only (continue-on-error) — pnpm audit --prod above
            # is the blocking gate for shipped deps; this surfaces CVEs in the
            # devDependency tree (ttsc toolchain, build tooling) that the
            # --prod gate deliberately excludes, without letting an unfixable
            # dev-only advisory block PRs.
            - name: Audit dev dependencies (informational)
              continue-on-error: true
              run: pnpm audit --audit-level=high

            - name: Run tests with coverage
              run: pnpm test:coverage

            # Pushes to master/develop are reported by build.yml's release chain;
            # uploading them here too would record a second Coveralls build for
            # the same commit. Upload only; Coveralls outages never gate a run.
            - name: Upload JS coverage to Coveralls
              if: github.event_name == 'pull_request' || (github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop')
              uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  file: coverage/lcov.info
                  format: lcov
                  parallel: true
                  flag-name: js
                  fail-on-error: false

            # Rebuild the asset BEFORE validating it. Validating only the committed
            # copy would let a PR edit lexicon-concepts.json (weights, dims, a new
            # cluster) without re-running the build and still pass — the gate would
            # be checking the stale asset, not the config under review. The build is
            # seeded and deterministic, so a clean tree here also proves the
            # committed asset matches its source.
            - name: Verify lexicon asset is up to date
              run: pnpm build:lexicon && git diff --exit-code src/assets/semantic-vectors.json

            - name: Verify lexicon separates signal from noise at the match floor
              run: pnpm verify:lexicon

            - name: Bundle size budget (renderer bundles)
              run: pnpm size

    android:
        # JVM unit tests (JUnit + Robolectric + MockWebServer) for the native
        # Kotlin/Java code under android/app/src/main, with JaCoCo coverage.
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup build environment
              uses: ./.github/actions/setup-build
              with:
                  cache-vision-model: 'true'

            - name: Setup Java (JDK 21 — required by Capacitor 8 plugins' kotlin jvmToolchain)
              uses: actions/setup-java@v6
              with:
                  distribution: 'temurin'
                  java-version: '21'
                  cache: 'gradle'
                  cache-dependency-path: |
                      android/**/*.gradle*
                      android/gradle/wrapper/gradle-wrapper.properties

            - name: Setup Android SDK
              uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

            # cap sync generates the Capacitor gradle subprojects (node_modules
            # paths, capacitor-cordova-android-plugins) and the bridge config
            # assets the tests load; it refuses to run without the web build.
            - name: Build renderer
              run: pnpm build:prep

            - name: Sync Capacitor
              run: pnpm exec cap sync android

            - name: Run Android unit tests with coverage
              working-directory: android
              run: ./gradlew testDebugUnitTest jacocoTestReport

            - name: Upload Android coverage to Coveralls
              if: github.event_name == 'pull_request' || (github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop')
              uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  file: android/app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
                  format: jacoco
                  # JaCoCo reports package-relative paths (com/isthisgitlab/…);
                  # anchor them to the source root so Coveralls finds the files.
                  base-path: android/app/src/main/java
                  parallel: true
                  flag-name: android
                  fail-on-error: false

            # After the upload so a red gate still publishes the report that
            # shows which lines are missing.
            - name: Enforce 100% Android coverage
              working-directory: android
              run: ./gradlew jacocoTestCoverageVerification

    coverage-finish:
        # Closes the parallel Coveralls build once both the JS and the Android
        # reports are in. always() so a red test job still publishes whatever
        # coverage was uploaded.
        needs: [test, android]
        if: always() && (github.event_name == 'pull_request' || (github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop'))
        runs-on: ubuntu-slim

        steps:
            - name: Finish Coveralls parallel build
              uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  parallel-finished: true
                  carryforward: 'js,android'
                  fail-on-error: false

    typecheck:
        # Separate standard runner: on a cold cache ttsc compiles the
        # @ttsc/lint Go plugin from source (~6 CPU-minutes, ~25 min wall on a
        # single core, 1.6 GiB of GOCACHE), which blows the ubuntu-slim job
        # cap and surfaces as "The operation was canceled".
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '26'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Only the built plugin binary (~35 MB) is needed for a warm start;
            # the multi-GiB go-build cache next to it is deliberately not saved.
            # ttsc keys plugins by its own content hash, so a toolchain bump
            # just misses, rebuilds once, and saves under the new lockfile key.
            - name: Cache compiled ttsc plugins
              uses: actions/cache@v6
              with:
                  path: node_modules/.cache/ttsc/plugins
                  key: ttsc-plugins-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: ttsc-plugins-${{ runner.os }}-${{ runner.arch }}-

            # ttsc runs the type-check (JSDoc + checkJs opt-in) AND the
            # @ttsc/lint pass (lint.config.ts) in one compile — a red run here
            # can be either a type error or an error-severity lint rule. The
            # band hint lives in the step name because Actions never shows
            # YAML comments in the log.
            - name: Type-check + lint via ttsc (TS9000-TS17999 = lint rule, see lint.config.ts)
              run: pnpm typecheck

    knip:
        # knip runs on a separate, standard runner: its parser (oxc-parser)
        # allocates a ~2 GiB ArrayBuffer for raw transfer, which the
        # memory-constrained ubuntu-slim runner used by the `test` job cannot
        # satisfy (it crashes with "Array buffer allocation failed"). oxc picks
        # raw transfer purely from the platform (64-bit + Node ≥ 22) with no
        # opt-out, so the fix is more memory rather than a flag.
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '26'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Dead-code / unused-dependency check
              run: pnpm knip
