name: Test

on:
    push:
        branches: [master, develop, feature/*]
    pull_request:
        branches: [master, develop]

# Least-privilege default token. `pnpm install` runs the postinstall scripts
# opted into allowBuilds (esbuild, @swc/core, …), so a compromised transitive
# dep here must not inherit a write-capable GITHUB_TOKEN.
permissions:
    contents: read

# Cancel superseded runs on the same ref for PRs (fast feedback), but let
# branch pushes finish so a green run is recorded per commit.
concurrency:
    group: test-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# onnxruntime-node's postinstall otherwise downloads the CUDA execution provider
# from NuGet on every linux/x64 install; the app only runs ORT on cpu/wasm
# (services/visionVerifier.ts), so it is dead weight and a NuGet outage fails the job.
env:
    ONNXRUNTIME_NODE_INSTALL: skip

jobs:
    classify-dependabot-workflow-pr:
        runs-on: ubuntu-slim
        permissions:
            contents: read
            pull-requests: read
        outputs:
            workflow_only: ${{ steps.classify.outputs.workflow_only }}
            codeql_changed: ${{ steps.classify.outputs.codeql_changed }}

        steps:
            - name: Checkout classifier
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event.pull_request.base.sha || github.sha }}

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: '26'

            - name: Classify Dependabot workflow-only PR
              id: classify
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  PR_AUTHOR: ${{ github.event.pull_request.user.login }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: >-
                  node --input-type=module --eval 'const { main } = await import("./scripts/classify-dependabot-workflow-pr.mts"); await main({ env: process.env, fetchImpl: globalThis.fetch })'

    test:
        # Oxlint's JS plugin allocator crashes on the 5 GB ubuntu-slim runner.
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup build environment
              uses: ./.github/actions/setup-build
              with:
                  cache-vision-model: 'true'
                  turbo-cache-scope: test

            - name: Audit dependencies
              # --prod scopes the gate to shipped runtime deps (the ones that
              # handle auth tokens) so an unfixable advisory in a dev-only or
              # alpha-pinned tool can't block unrelated PRs. An unresolvable prod
              # advisory can be excepted via `auditConfig` in pnpm-workspace.yaml.
              run: pnpm audit --prod --audit-level=high

            - name: Run linter
              run: pnpm lint

            # Informational only (continue-on-error) — pnpm audit --prod above
            # is the blocking gate for shipped deps; this surfaces CVEs in the
            # devDependency tree (lint, type-check and build tooling) that the
            # --prod gate deliberately excludes, without letting an unfixable
            # dev-only advisory block PRs.
            - name: Audit dev dependencies (informational)
              continue-on-error: true
              run: pnpm audit --audit-level=high

            - name: Run tests with coverage
              run: pnpm test:coverage

            # Pushes to master/develop are reported by build.yml's release chain;
            # uploading them here too would record a second Coveralls build for
            # the same commit. Upload only; Coveralls outages never gate a run.
            - name: Upload JS coverage to Coveralls
              if: github.event_name == 'pull_request' || (github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop')
              uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  file: coverage/lcov.info
                  format: lcov
                  parallel: true
                  flag-name: js
                  fail-on-error: false

            # Rebuild the asset BEFORE validating it. Validating only the committed
            # copy would let a PR edit lexicon-concepts.json (weights, dims, a new
            # cluster) without re-running the build and still pass — the gate would
            # be checking the stale asset, not the config under review. The build is
            # seeded and deterministic, so a clean tree here also proves the
            # committed asset matches its source.
            - name: Verify lexicon asset is up to date
              run: pnpm build:lexicon && git diff --exit-code src/assets/semantic-vectors.json

            - name: Verify lexicon separates signal from noise at the match floor
              run: pnpm verify:lexicon

            # Generated from pnpm-lock.yaml and the vendored license texts, so a
            # dependency bump that changes the shipped set fails here until the
            # notices are regenerated and committed.
            - name: Verify third-party notices are up to date
              run: |
                  pnpm build:notices
                  if ! git diff --quiet -- src/assets/THIRD_PARTY_NOTICES.txt; then
                    echo "::error::The third-party notices are out of date: run 'pnpm build:notices' and commit src/assets/THIRD_PARTY_NOTICES.txt"
                    git diff --stat -- src/assets/THIRD_PARTY_NOTICES.txt
                    exit 1
                  fi

            - name: Bundle size budget (renderer bundles)
              run: pnpm size

    android:
        # JVM unit tests (JUnit + Robolectric + MockWebServer) for the native
        # Kotlin/Java code under android/app/src/main, with JaCoCo coverage.
        needs: classify-dependabot-workflow-pr
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            RUN_FULL_CHECKS: ${{ needs.classify-dependabot-workflow-pr.result != 'success' || needs.classify-dependabot-workflow-pr.outputs.workflow_only != 'true' }}

        steps:
            - name: Checkout code
              if: env.RUN_FULL_CHECKS == 'true'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            # Rejects a tampered gradle-wrapper.jar before ./gradlew runs it.
            - name: Validate Gradle wrapper
              if: env.RUN_FULL_CHECKS == 'true'
              uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

            # A failed dependency check (android/gradle/verification-metadata.xml) says how to regenerate it.
            - name: Explain Gradle dependency verification failures
              if: env.RUN_FULL_CHECKS == 'true'
              uses: ./.github/actions/gradle-verification-hint

            - name: Setup build environment
              if: env.RUN_FULL_CHECKS == 'true'
              uses: ./.github/actions/setup-build
              with:
                  cache-vision-model: 'true'
                  turbo-cache-scope: android

            - name: Setup Java (JDK 27 — Capacitor 8's Java 21 source/target sets the floor)
              if: env.RUN_FULL_CHECKS == 'true'
              uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
              with:
                  distribution: 'temurin'
                  java-version: '27'
                  cache: 'gradle'
                  cache-dependency-path: |
                      android/**/*.gradle*
                      android/gradle/wrapper/gradle-wrapper.properties

            - name: Setup Android SDK
              if: env.RUN_FULL_CHECKS == 'true'
              uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

            # cap sync generates the Capacitor gradle subprojects (node_modules
            # paths, capacitor-cordova-android-plugins) and the bridge config
            # assets the tests load; it refuses to run without the web build.
            - name: Build renderer
              if: env.RUN_FULL_CHECKS == 'true'
              run: pnpm build:prep

            - name: Sync Capacitor
              if: env.RUN_FULL_CHECKS == 'true'
              run: pnpm exec cap sync android

            # The lists the third-party notices test holds the Android notices to (what the release APK ships, at which
            # versions, and which of it carries a NOTICE file) must match the dependency graph as it is now.
            - name: Check the release runtime lists are current
              if: env.RUN_FULL_CHECKS == 'true'
              run: |
                  scripts/android-runtime-artifacts.sh
                  if ! git diff --exit-code -- android/release-runtime-artifacts.txt android/release-runtime-versions.txt android/release-runtime-notices.txt; then
                      echo "::error::The release runtime lists are out of date. Run scripts/android-runtime-artifacts.sh (or scripts/android-verification-metadata.sh after a dependency change) and commit android/release-runtime-artifacts.txt, android/release-runtime-versions.txt and android/release-runtime-notices.txt."
                      exit 1
                  fi

            - name: Run Android unit tests with coverage
              if: env.RUN_FULL_CHECKS == 'true'
              working-directory: android
              run: ./gradlew testDebugUnitTest jacocoTestReport

            - name: Upload Android coverage to Coveralls
              if: >-
                  env.RUN_FULL_CHECKS == 'true' &&
                  (github.event_name == 'pull_request' ||
                  (github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop'))
              uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  file: android/app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
                  format: jacoco
                  # JaCoCo reports package-relative paths (com/isthisgitlab/…);
                  # anchor them to the source root so Coveralls finds the files.
                  base-path: android/app/src/main/java
                  parallel: true
                  flag-name: android
                  fail-on-error: false

            # After the upload so a red gate still publishes the report that
            # shows which lines are missing.
            - name: Enforce 100% Android coverage
              if: env.RUN_FULL_CHECKS == 'true'
              working-directory: android
              run: ./gradlew jacocoTestCoverageVerification

            - name: Android checks skipped for Dependabot workflow-only PR
              if: always() && env.RUN_FULL_CHECKS != 'true'
              run: echo 'Android checks skipped for a Dependabot workflow-only PR.'

    coverage-finish:
        # Closes the parallel Coveralls build once both the JS and the Android
        # reports are in. always() so a red test job still publishes whatever
        # coverage was uploaded.
        needs: [classify-dependabot-workflow-pr, test, android]
        if: always() && (github.event_name == 'pull_request' || (github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop'))
        runs-on: ubuntu-slim

        steps:
            - name: Finish Coveralls parallel build
              uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  parallel-finished: true
                  carryforward: ${{ needs.classify-dependabot-workflow-pr.result == 'success' && needs.classify-dependabot-workflow-pr.outputs.workflow_only == 'true' && 'android' || 'js,android' }}
                  fail-on-error: false

    typecheck:
        # Its own job so a type error reads as its own red check, separate from
        # lint and tests.
        needs: classify-dependabot-workflow-pr
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            RUN_FULL_CHECKS: ${{ needs.classify-dependabot-workflow-pr.result != 'success' || needs.classify-dependabot-workflow-pr.outputs.workflow_only != 'true' }}

        steps:
            - name: Checkout code
              if: env.RUN_FULL_CHECKS == 'true'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup build environment
              if: env.RUN_FULL_CHECKS == 'true'
              uses: ./.github/actions/setup-build
              with:
                  turbo-cache-scope: typecheck

            # Strict type-check of the src/ts TypeScript with the native tsc (checker only, noEmit).
            # Lint, including the type-aware promise rules, runs in `pnpm lint`.
            - name: Type-check
              if: env.RUN_FULL_CHECKS == 'true'
              run: pnpm typecheck

            - name: Type-check skipped for Dependabot workflow-only PR
              if: always() && env.RUN_FULL_CHECKS != 'true'
              run: echo 'Type-check skipped for a Dependabot workflow-only PR.'

    knip:
        # knip runs on a separate, standard runner: its parser (oxc-parser)
        # allocates a ~2 GiB ArrayBuffer for raw transfer, which the
        # memory-constrained ubuntu-slim runner cannot
        # satisfy (it crashes with "Array buffer allocation failed"). oxc picks
        # raw transfer purely from the platform (64-bit + Node ≥ 22) with no
        # opt-out, so the fix is more memory rather than a flag.
        needs: classify-dependabot-workflow-pr
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        env:
            RUN_FULL_CHECKS: ${{ needs.classify-dependabot-workflow-pr.result != 'success' || needs.classify-dependabot-workflow-pr.outputs.workflow_only != 'true' }}

        steps:
            - name: Checkout code
              if: env.RUN_FULL_CHECKS == 'true'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup build environment
              if: env.RUN_FULL_CHECKS == 'true'
              uses: ./.github/actions/setup-build
              with:
                  turbo-cache-scope: knip

            - name: Dead-code / unused-dependency check
              if: env.RUN_FULL_CHECKS == 'true'
              run: pnpm knip

            - name: Knip skipped for Dependabot workflow-only PR
              if: always() && env.RUN_FULL_CHECKS != 'true'
              run: echo 'Knip skipped for a Dependabot workflow-only PR.'
