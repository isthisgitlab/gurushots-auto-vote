name: CodeQL

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    schedule:
        # Weekly scan to catch advisories in code that hasn't changed.
        - cron: '21 4 * * 1'

# Collapse redundant runs on the same ref, but never abort an in-progress scan
# (a partial SARIF upload is worse than a duplicate).
concurrency:
    group: codeql-${{ github.ref }}
    cancel-in-progress: false

# NOTE: JS/TS only. A java-kotlin leg to scan the Android/Capacitor Kotlin was
# attempted but reverted — CodeQL's Kotlin extractor rejects this repo's Kotlin
# version ("Kotlin version 2.4.20 is too recent. CodeQL currently supports
# versions below 2.4.20"), so the leg fails at compileDebugKotlin with no way to
# configure around it. Re-add the java-kotlin matrix leg (manual build-mode,
# `./gradlew assembleDebug` under android/, with setup-java 21 + setup-android +
# `cap sync android`) once the CodeQL extractor supports Kotlin 2.4.20+, or if
# the Android Kotlin is ever pinned back below that.
jobs:
    analyze:
        name: Analyze (javascript-typescript)
        runs-on: ubuntu-slim
        timeout-minutes: 20
        permissions:
            actions: read
            contents: read
            security-events: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: javascript-typescript
                  # No compilation needed for JS/TS sources.
                  build-mode: none
                  queries: security-and-quality

            - name: Perform CodeQL analysis
              uses: github/codeql-action/analyze@v4
              with:
                  category: '/language:javascript-typescript'
