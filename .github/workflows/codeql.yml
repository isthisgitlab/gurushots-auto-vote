name: CodeQL

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    schedule:
        # Weekly scan to catch advisories in code that hasn't changed.
        - cron: '21 4 * * 1'

# Collapse redundant runs on the same ref, but never abort an in-progress scan
# (a partial SARIF upload is worse than a duplicate).
concurrency:
    group: codeql-${{ github.ref }}
    cancel-in-progress: false

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ${{ matrix.runner }}
        timeout-minutes: ${{ matrix.language == 'java-kotlin' && 30 || 20 }}
        permissions:
            actions: read
            contents: read
            security-events: write

        strategy:
            # Independent legs — a build failure in the Android/Kotlin leg must
            # not suppress the JS/TS SARIF upload, and vice-versa.
            fail-fast: false
            matrix:
                include:
                    - language: javascript-typescript
                      # No compilation needed for JS/TS sources.
                      build-mode: none
                      runner: ubuntu-slim
                    - language: java-kotlin
                      # The Capacitor app ships custom Kotlin in every signed
                      # release APK; scan it too. Manual build-mode with an
                      # explicit debug assemble (no signing secrets needed) is
                      # more deterministic here than autobuild finding gradlew
                      # under android/.
                      build-mode: manual
                      runner: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up JDK 21
              if: matrix.language == 'java-kotlin'
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: '21'

            - name: Set up Android SDK
              if: matrix.language == 'java-kotlin'
              uses: android-actions/setup-android@v4

            - name: Install pnpm
              if: matrix.language == 'java-kotlin'
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              if: matrix.language == 'java-kotlin'
              uses: actions/setup-node@v7
              with:
                  node-version: '26'
                  cache: 'pnpm'

            - name: Sync Capacitor web assets
              if: matrix.language == 'java-kotlin'
              run: |
                  pnpm install --frozen-lockfile
                  pnpm run build:prep
                  pnpm exec cap sync android

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}
                  queries: security-and-quality

            - name: Build Android (manual build-mode)
              if: matrix.language == 'java-kotlin'
              run: ./gradlew --no-daemon assembleDebug
              working-directory: android

            - name: Perform CodeQL analysis
              uses: github/codeql-action/analyze@v4
              with:
                  category: '/language:${{ matrix.language }}'
