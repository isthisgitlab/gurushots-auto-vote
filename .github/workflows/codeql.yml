name: CodeQL

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    schedule:
        # Weekly scan to catch advisories in code that hasn't changed.
        - cron: '21 4 * * 1'

# Collapse redundant runs on the same ref, but never abort an in-progress scan
# (a partial SARIF upload is worse than a duplicate).
concurrency:
    group: codeql-${{ github.ref }}
    cancel-in-progress: false

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ${{ matrix.runner }}
        timeout-minutes: ${{ matrix.language == 'java-kotlin' && 30 || 20 }}
        permissions:
            actions: read
            contents: read
            security-events: write

        strategy:
            # Independent legs — a build failure in the Android/Kotlin leg must
            # not suppress the other SARIF uploads, and vice-versa.
            fail-fast: false
            matrix:
                include:
                    - language: javascript-typescript
                      # No compilation needed for JS/TS sources.
                      build-mode: none
                      runner: ubuntu-slim
                    - language: java-kotlin
                      # The Capacitor app ships custom Kotlin/Java in every
                      # signed release APK. Manual build-mode with an explicit
                      # debug assemble (no signing secrets needed) is more
                      # deterministic than autobuild hunting for gradlew under
                      # android/. Needs a CodeQL bundle >= 2.27.1: older
                      # extractors reject Kotlin 2.4.20 as "too recent".
                      build-mode: manual
                      runner: ubuntu-latest
                    - language: actions
                      # The workflows and the setup-build composite action.
                      build-mode: none
                      runner: ubuntu-slim

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Java (JDK 21 — required by Capacitor 8 plugins' kotlin jvmToolchain)
              if: matrix.language == 'java-kotlin'
              uses: actions/setup-java@v6
              with:
                  distribution: 'temurin'
                  java-version: '21'
                  cache: 'gradle'
                  cache-dependency-path: |
                      android/**/*.gradle*
                      android/gradle/wrapper/gradle-wrapper.properties

            - name: Setup Android SDK
              if: matrix.language == 'java-kotlin'
              uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

            - name: Setup build environment
              if: matrix.language == 'java-kotlin'
              uses: ./.github/actions/setup-build

            # cap sync generates the Capacitor gradle subprojects and bridge
            # config assets; it refuses to run without the web build. Runs
            # before CodeQL init so none of it is traced.
            - name: Build renderer
              if: matrix.language == 'java-kotlin'
              run: pnpm build:prep

            - name: Sync Capacitor
              if: matrix.language == 'java-kotlin'
              run: pnpm exec cap sync android

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}
                  queries: security-and-quality
                  # Rules that flag the Android app's design rather than a defect:
                  # - javascript-enabled / addjavascriptinterface: the headless
                  #   voting WebView (AutoVoteService) exists to run the bundled JS
                  #   through its native bridges. It loads only the packaged
                  #   WebViewAssetLoader origin with file and content access off,
                  #   and the HTTP bridge is pinned to https *.gurushots.com.
                  # - arbitrary-apk-installation: fires on any FileProvider URI
                  #   handed to an APK install intent, i.e. on every in-app
                  #   updater (ApkInstallerPlugin). The system installer still asks
                  #   the user, and Android rejects an update signed with another key.
                  config: |
                      query-filters:
                          - exclude:
                                id:
                                    - java/android/websettings-javascript-enabled
                                    - java/android/webview-addjavascriptinterface
                                    - java/android/arbitrary-apk-installation

            # --no-build-cache keeps every compile task executing (a cached
            # FROM-CACHE task is invisible to the extractor); --no-daemon stops
            # Gradle from reusing a daemon started outside the traced build.
            - name: Build Android (manual build-mode)
              if: matrix.language == 'java-kotlin'
              working-directory: android
              run: ./gradlew --no-daemon --no-build-cache assembleDebug

            - name: Perform CodeQL analysis
              uses: github/codeql-action/analyze@v4
              with:
                  category: '/language:${{ matrix.language }}'
