name: CodeQL

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    schedule:
        # Weekly scan to catch advisories in code that hasn't changed.
        - cron: '21 4 * * 1'

# Collapse redundant runs on the same ref, but never abort an in-progress scan
# (a partial SARIF upload is worse than a duplicate).
concurrency:
    group: codeql-${{ github.ref }}
    cancel-in-progress: false

# onnxruntime-node's postinstall otherwise downloads the CUDA execution provider
# from NuGet on every linux/x64 install; the app only runs ORT on cpu/wasm
# (services/visionVerifier.ts), so it is dead weight and a NuGet outage fails the job.
env:
    ONNXRUNTIME_NODE_INSTALL: skip

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ${{ matrix.runner }}
        timeout-minutes: ${{ matrix.language == 'java-kotlin' && 30 || 20 }}
        permissions:
            actions: read
            contents: read
            security-events: write

        strategy:
            # Independent legs — a build failure in the Android/Kotlin leg must
            # not suppress the other SARIF uploads, and vice-versa.
            fail-fast: false
            matrix:
                include:
                    - language: javascript-typescript
                      # No compilation needed for JS/TS sources.
                      build-mode: none
                      runner: ubuntu-slim
                    - language: java-kotlin
                      # The Capacitor app ships custom Kotlin/Java in every
                      # signed release APK. Manual build-mode with an explicit
                      # debug assemble (no signing secrets needed) is more
                      # deterministic than autobuild hunting for gradlew under
                      # android/. Needs a CodeQL bundle >= 2.27.1: older
                      # extractors reject Kotlin 2.4.20 as "too recent".
                      build-mode: manual
                      runner: ubuntu-latest
                    - language: actions
                      # The workflows and the setup-build composite action.
                      build-mode: none
                      runner: ubuntu-slim

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            # src/ts uses ESM syntax but is transpiled under the root CommonJS
            # package at runtime. Give CodeQL its source module boundary so
            # cross-file imports resolve instead of yielding false alerts.
            - name: Mark source modules for CodeQL
              if: matrix.language == 'javascript-typescript'
              run: printf '%s\n' '{"type":"module"}' > src/ts/package.json

            - name: Setup Java (JDK 21 — required by Capacitor 8 plugins' kotlin jvmToolchain)
              if: matrix.language == 'java-kotlin'
              uses: actions/setup-java@v6
              with:
                  distribution: 'temurin'
                  java-version: '21'
                  cache: 'gradle'
                  cache-dependency-path: |
                      android/**/*.gradle*
                      android/gradle/wrapper/gradle-wrapper.properties

            - name: Setup Android SDK
              if: matrix.language == 'java-kotlin'
              uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

            - name: Setup build environment
              if: matrix.language == 'java-kotlin'
              uses: ./.github/actions/setup-build
              with:
                  cache-vision-model: 'true'

            # cap sync generates the Capacitor gradle subprojects and bridge
            # config assets; it refuses to run without the web build. Runs
            # before CodeQL init so none of it is traced.
            - name: Build renderer
              if: matrix.language == 'java-kotlin'
              run: pnpm build:prep

            - name: Sync Capacitor
              if: matrix.language == 'java-kotlin'
              run: pnpm exec cap sync android

            # Capacitor includes plugin Java sources as Gradle subprojects under
            # node_modules. Compile those dependencies before CodeQL starts so
            # the traced build analyzes only the app's own Kotlin/Java sources.
            - name: Prebuild Android dependencies
              if: matrix.language == 'java-kotlin'
              working-directory: android
              run: ./gradlew --no-daemon --no-build-cache assembleDebug

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}
                  queries: security-and-quality
                  # Rules that flag the app's design rather than a defect:
                  # - javascript-enabled / addjavascriptinterface: the headless
                  #   voting WebView (AutoVoteService) exists to run the bundled JS
                  #   through its native bridges. It loads only the packaged
                  #   WebViewAssetLoader origin with file and content access off,
                  #   and the HTTP bridge is pinned to https *.gurushots.com.
                  # - arbitrary-apk-installation: fires on any FileProvider URI
                  #   handed to an APK install intent, i.e. on every in-app
                  #   updater (ApkInstallerPlugin). The system installer still asks
                  #   the user, and Android rejects an update signed with another key.
                  # - file-access-to-http: the auth token persisted in the settings
                  #   file is sent to the GuruShots API, which is the app's purpose;
                  #   request URLs come from the hard-coded api.gurushots.com base.
                  # - http-to-file-access: API responses are written to the app's
                  #   own log files at fixed paths, after sanitizeForLog/redactMessage
                  #   and CR/LF collapse.
                  config: |
                      query-filters:
                          - exclude:
                                id:
                                    - java/android/websettings-javascript-enabled
                                    - java/android/webview-addjavascriptinterface
                                    - java/android/arbitrary-apk-installation
                                    - js/file-access-to-http
                                    - js/http-to-file-access

            # Clean only :app, leaving the prebuilt plugin subprojects up to
            # date. --no-build-cache prevents restoring app classes from cache;
            # --no-daemon keeps the compile inside CodeQL's traced process.
            - name: Build Android (manual build-mode)
              if: matrix.language == 'java-kotlin'
              working-directory: android
              run: |
                  ./gradlew --no-daemon --no-build-cache :app:clean
                  ./gradlew --no-daemon --no-build-cache :app:assembleDebug

            - name: Perform CodeQL analysis
              uses: github/codeql-action/analyze@v4
              with:
                  category: '/language:${{ matrix.language }}'
