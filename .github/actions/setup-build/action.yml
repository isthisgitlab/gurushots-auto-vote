name: Setup Build Environment
description: Repeated setup shared by test, build matrix, build-android, and create-release. Activates pnpm via corepack (pinned by the packageManager field), sets up Node 26 with pnpm cache, optionally pulls the bumped package.json artifact, and installs dependencies.

inputs:
    cache-vision-model:
        description: Restore the pinned vision model for jobs that build full assets.
        required: false
        default: 'false'
    download-bumped:
        description: When 'true', download the bumped-package artifact uploaded by the version-bump job before installing.
        required: false
        default: 'false'
    install:
        description: When 'true' (default), run `pnpm install --frozen-lockfile`. Set 'false' for jobs that want to install differently.
        required: false
        default: 'true'
    turbo-cache-scope:
        description: A distinct cache partition for each matrix cell that invokes this action.
        required: false
        default: default

runs:
    using: composite
    steps:
        - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

        - id: node
          uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
          with:
              node-version: '26'
              cache: 'pnpm'

        - id: turbo-runtime
          shell: bash
          run: echo "node=$(node --version)" >> "$GITHUB_OUTPUT"

        - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: .turbo/cache
              key: turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.turbo-runtime.outputs.node }}-${{ github.job }}-${{ inputs.turbo-cache-scope }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
              restore-keys: |
                  turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.turbo-runtime.outputs.node }}-${{ github.job }}-${{ inputs.turbo-cache-scope }}-${{ hashFiles('pnpm-lock.yaml') }}-

        - if: inputs.download-bumped == 'true'
          uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
          with:
              name: bumped-package
              path: .

        - if: inputs.install == 'true'
          shell: bash
          run: pnpm install --frozen-lockfile

        - if: inputs.cache-vision-model == 'true'
          uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: .cache/vision-model
              key: vision-model-${{ runner.os }}-${{ hashFiles('scripts/fetch-vision-model.ts') }}
