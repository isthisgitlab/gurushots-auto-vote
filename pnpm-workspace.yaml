# pnpm 12 requires explicit approval for postinstall/install scripts.
# Each entry below is a package whose lifecycle script we permit to execute.
# Keep this list minimal — every entry is an arbitrary-code-execution opportunity.
# Not gated here: pnpm 12's own self-managed binary (managePackageManagerVersions,
# recorded as @pnpm/exe.* in pnpm-lock.yaml) is the package manager itself, not a
# dependency lifecycle script, and is integrity-pinned by per-platform sha512.
allowBuilds:
    # esbuild bundler (build:react + build-cli SEA bundling) — postinstall sets up native binary.
    esbuild: true
    # @swc/jest's underlying compiler — postinstall installs the native bindings used by Jest.
    '@swc/core': true
    # File watcher pulled in transitively by @tailwindcss/cli and by Jest (jest-haste-map) — install script
    # builds/downloads the native watcher.
    '@parcel/watcher': true
    # electron-builder dependency — install script picks the right 7-Zip binary per arch.
    electron-winstaller: true
    # Native resolver pulled in transitively by Jest — napi-postinstall verifies prebuilds.
    unrs-resolver: true
    # lefthook's only build script is a convenience that auto-runs `lefthook install`;
    # our `prepare` script does that explicitly, so no lifecycle script is needed here.
    lefthook: false
    # Local image inference downloads the pinned native ONNX binding at install time.
    onnxruntime-node: true
    # protobufjs postinstall only prints a donation message; runtime needs no build.
    protobufjs: false
# `autoInstallPeers` lets pnpm resolve unlisted peer deps automatically. Combined with
# a committed `pnpm-lock.yaml` and `--frozen-lockfile` in CI, the install is reproducible;
# the convenience is contained to first-time / dependency-update flows.
autoInstallPeers: true
# Fail fast on conflicting peer ranges rather than silently picking a winner.
strictPeerDependencies: true
# Check dependency engines against the minimum supported Node version, including
# when Dependabot regenerates the lockfile under an older host Node. The
# preinstall script checks the actual Node version for normal installs.
nodeVersion: 26.0.0
# Honor the `engines` field in package.json (Node 26+ — that's its only key;
# the pnpm version is pinned via `packageManager` + corepack, and pnpm 12's
# managePackageManagerVersions default additionally records that resolved binary
# — with per-platform sha512 integrity — as @pnpm/exe.* in pnpm-lock.yaml).
engineStrict: true
# 6h gate — deliberately below the pnpm 12 default of 1440 (24h), so this is
# looser than Dependabot's cooldown (.github/dependabot.yml) rather than aligned
# with it. Note this only gates what pnpm resolves; `pnpm bump` (npm-check-updates)
# ignores it entirely and will still write the newest published version.
minimumReleaseAge: 360
# CVE overrides, exact-pinned for reproducibility. Re-check with a full `pnpm audit`
# after any lockfile change; drop an override once the upstream chain moves past
# the vulnerable range. All but one reach us only through build or test tooling;
# the global-agent entry is the exception (see it).
overrides:
    # xcode pins vulnerable uuid 7.x.
    'uuid@<11.1.1': 11.1.1
    # @tailwindcss/typography pins postcss-selector-parser 6.0.10 exactly, and 6.x
    # has no fix; the site CSS (`prose`) builds byte-identical on 7.1.6.
    'postcss-selector-parser@<7.1.6': 7.1.6
    # jest > babel-plugin-istanbul > @istanbuljs/load-nyc-config > js-yaml@3 >
    # argparse@1 > sprintf-js (no patched release). js-yaml 3's library code never
    # loads argparse, only its bin/js-yaml.js does, and load-nyc-config calls just
    # `require('js-yaml').load`; argparse 2 has no dependencies.
    'argparse@<2': 2.0.1
    # electron-builder > app-builder-lib > @electron/get 3 > global-agent 3 > roarr 2 >
    # sprintf-js (no patched release). global-agent 4.x is already in the SHIPPED tree
    # (onnxruntime-node depends on it); this only moves @electron/get's optional ^3 onto
    # it, and global-agent 4 drops roarr. Verified in node_modules: onnxruntime-node's
    # postinstall (script/install.js) calls global-agent's bootstrap() on EVERY install, and
    # @electron/get does when ELECTRON_GET_USE_PROXY is set. global-agent 4 reads
    # NODE_TLS_REJECT_UNAUTHORIZED strictly: any value other than true/t/yes/y/on/1 turns TLS
    # verification OFF for the connections it proxies. So do not set it to anything else when
    # installing or packaging behind a global-agent proxy (GLOBAL_AGENT_HTTP(S)_PROXY).
    # Developers who need no CUDA can set ONNXRUNTIME_NODE_INSTALL=skip, which skips the
    # Linux x64 CUDA 12 download that script otherwise makes (the bootstrap still runs first).
    'global-agent@<4': 4.1.3
    # @tailwindcss/cli pins @parcel/watcher 2.5.1 exactly, which pulls in micromatch
    # (and so braces); 2.6.0 matches with picomatch instead. Any older release is moved up too. Verified: the app and site
    # CSS build byte-identical, and `tailwindcss --watch=always` still rebuilds on a change.
    '@parcel/watcher@<2.6.0': 2.6.0
# braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm: stack exhaustion on deeply nested brace patterns)
# has NO patched release: 3.0.3 is the latest, and micromatch 4.0.8 and watchboy 0.4.3,
# the dependents that remain, are the latest too. What remains is electronmon > watchboy >
# micromatch > braces, a dev tool that restarts the app on file changes and only matches
# the patterns in this repository's package.json (`electronmon.patterns`); no input from
# the app, the network or a user ever becomes a pattern, and nothing of it ships.
# tests/ci-validation.test.ts fails if braces ever reaches the production tree.
# Re-check: 2026-10-06 (look for a braces release, or a micromatch/watchboy one that
# drops it, and remove this ignore then).
auditConfig:
    ignoreGhsas:
        - GHSA-vfj7-8cjw-p6xm
