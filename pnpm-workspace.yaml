# pnpm 12 requires explicit approval for postinstall/install scripts.
# Each entry below is a package whose lifecycle script we permit to execute.
# Keep this list minimal — every entry is an arbitrary-code-execution opportunity.
# Not gated here: pnpm 12's own self-managed binary (managePackageManagerVersions,
# recorded as @pnpm/exe.* in pnpm-lock.yaml) is the package manager itself, not a
# dependency lifecycle script, and is integrity-pinned by per-platform sha512.
allowBuilds:
    # esbuild bundler (build:react + build-cli SEA bundling) — postinstall sets up native binary.
    esbuild: true
    # @swc/jest's underlying compiler — postinstall installs the native bindings used by Jest.
    '@swc/core': true
    # File watcher pulled in transitively by electronmon — install script builds/downloads native watcher.
    '@parcel/watcher': true
    # electron-builder dependency — install script picks the right 7-Zip binary per arch.
    electron-winstaller: true
    # Native resolver pulled in transitively by ESLint v10 — napi-postinstall verifies prebuilds.
    unrs-resolver: true
    # lefthook's only build script is a convenience that auto-runs `lefthook install`;
    # our `prepare` script does that explicitly, so no lifecycle script is needed here.
    lefthook: false
    # Local image inference downloads the pinned native ONNX binding at install time.
    onnxruntime-node: true
    # protobufjs postinstall only prints a donation message; runtime needs no build.
    protobufjs: false
# `autoInstallPeers` lets pnpm resolve unlisted peer deps automatically. Combined with
# a committed `pnpm-lock.yaml` and `--frozen-lockfile` in CI, the install is reproducible;
# the convenience is contained to first-time / dependency-update flows.
autoInstallPeers: true
# Fail fast on conflicting peer ranges rather than silently picking a winner.
strictPeerDependencies: true
# Scoped exception to strictPeerDependencies: eslint-plugin-jsx-a11y (latest
# 6.10.2) still declares eslint ^3–^9 but works under the repo's ESLint 10.
# Drop this once the plugin's peer range includes eslint 10.
peerDependencyRules:
    allowedVersions:
        'eslint-plugin-jsx-a11y>eslint': '10'
# Honor the `engines` field in package.json (Node 26+ — that's its only key;
# the pnpm version is pinned via `packageManager` + corepack, and pnpm 12's
# managePackageManagerVersions default additionally records that resolved binary
# — with per-platform sha512 integrity — as @pnpm/exe.* in pnpm-lock.yaml).
engineStrict: true
# 6h gate — deliberately below the pnpm 12 default of 1440 (24h), so this is
# looser than Dependabot's cooldown (.github/dependabot.yml) rather than aligned
# with it. Note this only gates what pnpm resolves; `pnpm bump` (npm-check-updates)
# ignores it entirely and will still write the newest published version.
minimumReleaseAge: 360
# Dev-tree-only CVE overrides — upstream hard-pins block the fixes from
# arriving any other way (@electron/universal pins minimatch's old
# brace-expansion; node-gyp's tree pins undici 6.x; xcode pins uuid).
# Exact-pinned for reproducibility. All four resolve ONLY through dev
# tooling (electron-builder, node-gyp, @capacitor/cli) — nothing shipped.
# Re-check with a full `pnpm audit` after any lockfile change; drop an
# override once the upstream chain moves past the vulnerable range.
overrides:
    'brace-expansion@1': 1.1.18
    'brace-expansion@2': 2.1.4
    'undici@<6.28.0': 6.28.0
    'uuid@<11.1.1': 11.1.1
